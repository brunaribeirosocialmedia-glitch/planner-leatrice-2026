<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Planejamento Eleitoral 2026 — Leatrice Bez</title>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: system-ui, 'Segoe UI', Arial, sans-serif;
    background: #FFFFFF;
    color: #073F67;
    min-height: 100vh;
  }
  :root {
    --laranja: #F58220;
    --azul: #0878B9;
    --azul-escuro: #073F67;
    --fundo-alternado: #EAF5FB;
    --linha-div: #DCE7EC;
    --creme: #FFF1E5;
    --cinza-linha: #8AA2B0;
  }

  /* ===== HEADER ===== */
  #header {
    position: fixed; top: 0; left: 0; right: 0; z-index: 100;
    background: #fff;
    border-bottom: 3px solid var(--laranja);
    padding: 8px 20px;
    display: flex; align-items: center; justify-content: space-between;
    box-shadow: 0 2px 8px rgba(0,0,0,0.08);
    gap: 10px;
  }
  #header h1 { font-size: 1.05rem; font-weight: 700; color: var(--azul-escuro); letter-spacing: 0.06em; text-transform: uppercase; }
  #header-right { display: flex; align-items: center; gap: 8px; flex-shrink: 0; }
  .pilula-candidata { background: var(--azul); color: #fff; font-size: 0.75rem; font-weight: 700; letter-spacing: 0.05em; padding: 5px 12px; border-radius: 20px; }
  #status-salvo { font-size: 0.68rem; color: var(--cinza-linha); min-width: 90px; text-align: right; }

  /* Badge de modo */
  #badge-modo {
    font-size: 0.7rem; font-weight: 700; padding: 4px 10px; border-radius: 12px;
    cursor: pointer; border: none; letter-spacing: 0.04em; transition: all 0.15s;
  }
  #badge-modo.visualizacao { background: var(--fundo-alternado); color: var(--cinza-linha); border: 1.5px solid var(--linha-div); }
  #badge-modo.editor { background: #e8f5e9; color: #2e7d32; border: 1.5px solid #a5d6a7; }

  /* ===== MAIN ===== */
  #main { margin-top: 60px; padding: 18px 20px 60px; }

  /* ===== BOTÕES ===== */
  .btn { font-family: inherit; font-size: 0.76rem; font-weight: 600; letter-spacing: 0.04em; text-transform: uppercase; padding: 7px 14px; border-radius: 6px; border: none; cursor: pointer; transition: opacity 0.15s; }
  .btn:hover { opacity: 0.85; }
  .btn:disabled { opacity: 0.35; cursor: not-allowed; }
  .btn-azul { background: var(--azul); color: #fff; }
  .btn-laranja { background: var(--laranja); color: #fff; }
  .btn-outline { background: transparent; color: var(--azul-escuro); border: 1.5px solid var(--linha-div); }
  .btn-outline:hover { background: var(--fundo-alternado); }
  .btn-voltar { background: var(--fundo-alternado); border: 1.5px solid var(--linha-div); border-radius: 6px; color: var(--azul); font-size: 0.85rem; font-weight: 600; cursor: pointer; padding: 8px 16px; display: inline-flex; align-items: center; gap: 6px; transition: background 0.15s; }
  .btn-voltar:hover { background: var(--linha-div); }

  /* ===== BARRA DE AÇÕES ===== */
  #barra-acoes { display: flex; gap: 8px; margin-bottom: 18px; flex-wrap: wrap; align-items: center; }

  /* ===== GRADE ===== */
  .grade-semanas { display: grid; grid-template-columns: repeat(4, 1fr); gap: 14px; }

  /* ===== CARTÃO SEMANA ===== */
  .cartao-semana { border-radius: 8px; overflow: hidden; border: 1px solid var(--linha-div); cursor: pointer; transition: box-shadow 0.15s; }
  .cartao-semana:hover { box-shadow: 0 4px 16px rgba(7,63,103,0.12); }
  .cartao-header { background: var(--azul); color: #fff; padding: 10px 12px 8px; display: flex; align-items: flex-start; gap: 10px; height: 90px; }
  .circulo-sem { background: var(--laranja); border-radius: 50%; width: 42px; height: 42px; display: flex; flex-direction: column; align-items: center; justify-content: center; flex-shrink: 0; line-height: 1.1; margin-top: 2px; }
  .circulo-sem .label-sem { font-size: 0.55rem; font-weight: 700; letter-spacing: 0.08em; text-transform: uppercase; }
  .circulo-sem .num-sem { font-size: 1.1rem; font-weight: 800; }
  .cartao-header-info { flex: 1; }
  .cartao-header-titulo { font-size: 0.68rem; font-weight: 700; letter-spacing: 0.1em; text-transform: uppercase; opacity: 0.9; }
  .cartao-header-periodo { font-size: 0.65rem; opacity: 0.8; margin-top: 2px; }
  .pilula-contador { background: rgba(255,255,255,0.2); color: #fff; font-size: 0.63rem; font-weight: 700; padding: 3px 7px; border-radius: 10px; white-space: nowrap; }

  /* ===== LINHAS DE DIA (CARTÃO) ===== */
  .linha-dia { display: flex; align-items: center; gap: 10px; padding: 7px 10px; border-bottom: 1px solid var(--linha-div); min-height: 50px; }
  .linha-dia:last-child { border-bottom: none; }
  .linha-dia:nth-child(even) { background: var(--fundo-alternado); }
  .linha-dia:nth-child(odd) { background: #fff; }
  .badge-dia { background: var(--laranja); color: #fff; border-radius: 6px; width: 34px; min-width: 34px; padding: 3px 0; text-align: center; flex-shrink: 0; line-height: 1.2; }
  .badge-dia .abrev { font-size: 0.56rem; font-weight: 700; letter-spacing: 0.04em; }
  .badge-dia .num-dia { font-size: 0.88rem; font-weight: 800; }
  .resumo-dia { flex: 1; overflow: hidden; }
  .resumo-cidade { font-size: 0.76rem; font-weight: 700; color: var(--azul-escuro); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .resumo-coord, .resumo-ativ { font-size: 0.66rem; color: var(--cinza-linha); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .resumo-vazio { font-size: 0.7rem; color: var(--cinza-linha); font-style: italic; }

  /* ===== CARTÃO ELEIÇÃO ===== */
  .cartao-eleicao { border-radius: 8px; overflow: hidden; border: 2px solid var(--laranja); cursor: pointer; transition: box-shadow 0.15s; background: var(--creme); }
  .cartao-eleicao:hover { box-shadow: 0 4px 16px rgba(245,130,32,0.2); }
  .cartao-eleicao-header { background: var(--laranja); color: #fff; padding: 10px 14px 8px; display: flex; align-items: center; gap: 10px; }
  .circulo-el { background: #fff; color: var(--laranja); border-radius: 50%; width: 42px; height: 42px; display: flex; flex-direction: column; align-items: center; justify-content: center; flex-shrink: 0; line-height: 1.1; }
  .circulo-el .label-el { font-size: 0.55rem; font-weight: 700; letter-spacing: 0.06em; }
  .circulo-el .num-el { font-size: 1rem; font-weight: 800; }
  .cartao-eleicao-body { padding: 10px 14px; }
  .campo-el-resumo { margin-bottom: 6px; }
  .campo-el-label { font-size: 0.6rem; font-weight: 700; color: var(--laranja); letter-spacing: 0.08em; text-transform: uppercase; }
  .campo-el-valor { font-size: 0.76rem; color: var(--azul-escuro); font-weight: 600; }
  .campo-el-vazio { font-size: 0.7rem; color: var(--cinza-linha); font-style: italic; }

  /* ===== TELAS ===== */
  #visao-geral { display: none; }
  #visao-geral.ativo { display: block; }
  #tela-semana { display: none; }
  #tela-semana.ativo { display: block; }
  #tela-dia { display: none; }
  #tela-dia.ativo { display: block; }
  #tela-eleicao { display: none; }
  #tela-eleicao.ativo { display: block; }

  /* ===== CARDS DE DIA (página 2) ===== */
  .card-dia { display: flex; align-items: stretch; border: 1px solid var(--linha-div); border-radius: 8px; overflow: hidden; margin-bottom: 10px; cursor: pointer; transition: box-shadow 0.15s; }
  .card-dia:hover { box-shadow: 0 3px 12px rgba(7,63,103,0.12); }
  .card-dia-faixa { background: var(--laranja); color: #fff; width: 80px; min-width: 80px; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 12px 4px; text-align: center; line-height: 1.3; }
  .card-dia-faixa .ds { font-size: 0.65rem; font-weight: 700; letter-spacing: 0.06em; text-transform: uppercase; }
  .card-dia-faixa .dd { font-size: 1rem; font-weight: 800; margin-top: 3px; }
  .card-dia-faixa .dm { font-size: 0.56rem; opacity: 0.85; margin-top: 1px; }
  .card-dia-corpo { flex: 1; padding: 12px 16px; background: #fff; display: flex; flex-direction: column; justify-content: center; gap: 4px; }
  .card-dia-cidade { font-size: 0.85rem; font-weight: 700; color: var(--azul-escuro); }
  .card-dia-coord  { font-size: 0.73rem; color: var(--cinza-linha); }
  .card-dia-horas  { font-size: 0.7rem; color: var(--azul); margin-top: 2px; }
  .card-dia-vazio  { font-size: 0.73rem; color: var(--cinza-linha); font-style: italic; }
  .card-dia-seta   { display: flex; align-items: center; padding: 0 14px; color: var(--cinza-linha); font-size: 1.1rem; }

  /* ===== NAV SEMANA ===== */
  .semana-nav { display: flex; align-items: center; justify-content: space-between; margin-bottom: 16px; gap: 8px; }
  .semana-nav h2 { font-size: 0.98rem; color: var(--azul-escuro); font-weight: 700; text-align: center; flex: 1; }
  .semana-nav h2 span { display: block; font-size: 0.73rem; font-weight: 400; color: var(--cinza-linha); margin-top: 2px; }

  /* ===== BLOCOS DE DIA ===== */
  .bloco-dia { display: flex; border: 1px solid var(--linha-div); border-radius: 8px; overflow: hidden; margin-bottom: 12px; }
  .faixa-lateral { background: var(--laranja); color: #fff; width: 80px; min-width: 80px; display: flex; flex-direction: column; align-items: center; justify-content: flex-start; padding: 14px 4px 14px; text-align: center; line-height: 1.3; flex-shrink: 0; }
  .faixa-lateral .dia-semana { font-size: 0.68rem; font-weight: 700; letter-spacing: 0.06em; text-transform: uppercase; }
  .faixa-lateral .dia-data { font-size: 0.78rem; font-weight: 800; margin-top: 4px; }
  .faixa-lateral .dia-mes { font-size: 0.56rem; opacity: 0.85; margin-top: 1px; }
  .bloco-campos { flex: 1; background: #fff; position: relative; }
  /* Cabeçalho (cidade + coordenador) */
  .bloco-cabecalho { padding: 12px 16px 10px; border-bottom: 2px solid var(--linha-div); display: flex; gap: 20px; align-items: flex-end; position: relative; }
  .campo-grupo { flex: 1; }
  .campo-grupo:last-of-type { margin-bottom: 0; }
  .campo-label { display: block; font-size: 0.61rem; font-weight: 700; color: var(--azul-escuro); letter-spacing: 0.1em; text-transform: uppercase; margin-bottom: 4px; }
  .campo-input { width: 100%; font-family: inherit; font-size: 0.84rem; color: var(--azul-escuro); border: none; border-bottom: 1.5px solid var(--cinza-linha); border-radius: 0; background: transparent; padding: 4px 0; outline: none; transition: border-color 0.15s; }
  .campo-input:focus { border-bottom-color: var(--azul); }
  .campo-input[readonly] { color: var(--azul-escuro); cursor: default; border-bottom-color: var(--linha-div); }
  .btn-limpar-dia { font-family: inherit; font-size: 0.63rem; color: var(--cinza-linha); background: none; border: 1px solid var(--linha-div); border-radius: 4px; padding: 3px 8px; cursor: pointer; text-transform: uppercase; letter-spacing: 0.04em; transition: color 0.15s, border-color 0.15s; white-space: nowrap; align-self: flex-start; margin-top: 2px; }
  .btn-limpar-dia:hover { color: #c0392b; border-color: #c0392b; }
  .btn-limpar-dia:disabled { display: none; }
  /* Grade de horários */
  .grade-horas { display: table; width: 100%; border-collapse: collapse; }
  .linha-hora { display: table-row; }
  .linha-hora:nth-child(even) { background: var(--fundo-alternado); }
  .celula-hora { display: table-cell; width: 56px; min-width: 56px; padding: 5px 10px; font-size: 0.75rem; font-weight: 700; color: var(--azul); border-right: 1px solid var(--linha-div); border-bottom: 1px solid var(--linha-div); vertical-align: middle; white-space: nowrap; }
  .celula-atividade { display: table-cell; padding: 4px 8px; border-bottom: 1px solid var(--linha-div); vertical-align: middle; }
  .celula-atividade input { width: 100%; font-family: inherit; font-size: 0.82rem; color: var(--azul-escuro); border: none; background: transparent; outline: none; padding: 3px 0; }
  .celula-atividade input[readonly] { cursor: default; color: var(--azul-escuro); }

  /* ===== TELA ELEIÇÃO ===== */
  .bloco-eleicao { border: 2px solid var(--laranja); border-radius: 8px; overflow: hidden; max-width: 700px; margin: 0 auto; }
  .bloco-eleicao-header { background: var(--laranja); color: #fff; padding: 14px 20px; font-size: 0.98rem; font-weight: 700; letter-spacing: 0.06em; text-transform: uppercase; }
  .bloco-eleicao-campos { background: var(--creme); padding: 20px; }

  /* ===== MODAL TOKEN ===== */
  #modal-token {
    display: none; position: fixed; inset: 0; z-index: 200;
    background: rgba(7,63,103,0.55); backdrop-filter: blur(3px);
    align-items: center; justify-content: center;
  }
  #modal-token.visivel { display: flex; }
  .modal-box { background: #fff; border-radius: 12px; padding: 28px 28px 24px; max-width: 460px; width: 90%; box-shadow: 0 8px 32px rgba(0,0,0,0.18); }
  .modal-box h3 { color: var(--azul-escuro); font-size: 1rem; margin-bottom: 8px; }
  .modal-box p { font-size: 0.8rem; color: var(--cinza-linha); margin-bottom: 18px; line-height: 1.5; }
  .modal-box p strong { color: var(--azul-escuro); }
  #input-token { width: 100%; font-family: monospace; font-size: 0.8rem; padding: 10px 12px; border: 1.5px solid var(--linha-div); border-radius: 6px; outline: none; margin-bottom: 8px; }
  #input-token:focus { border-color: var(--azul); }
  #erro-token { font-size: 0.72rem; color: #c0392b; min-height: 18px; margin-bottom: 10px; }
  .modal-acoes { display: flex; gap: 8px; justify-content: flex-end; }

  /* ===== INDICADOR DE SINCRONIZAÇÃO ===== */
  #sync-status { position: fixed; bottom: 28px; left: 20px; font-size: 0.68rem; color: var(--cinza-linha); display: flex; align-items: center; gap: 5px; }
  .sync-dot { width: 7px; height: 7px; border-radius: 50%; background: var(--cinza-linha); flex-shrink: 0; }
  .sync-dot.ok { background: #43a047; }
  .sync-dot.erro { background: #e53935; }
  .sync-dot.sync { background: var(--laranja); animation: pulsar 1s infinite; }
  @keyframes pulsar { 0%,100% { opacity:1 } 50% { opacity:0.3 } }

  /* ===== RODAPÉ ===== */
  #rodape { position: fixed; bottom: 0; left: 0; right: 0; background: rgba(255,255,255,0.95); border-top: 1px solid var(--linha-div); padding: 5px 20px; font-size: 0.68rem; color: var(--cinza-linha); display: flex; justify-content: flex-end; backdrop-filter: blur(4px); }

  /* ===== IMPRESSÃO ===== */
  @media print {
    @page { size: 1189mm 841mm landscape; margin: 12mm; }
    #header { position: static; box-shadow: none; }
    #barra-acoes, #rodape, #sync-status, #modal-token, .btn-voltar, .btn-limpar-dia, #badge-modo { display: none !important; }
    #visao-geral { display: block !important; }
    #tela-semana, #tela-eleicao { display: none !important; }
    .cartao-semana, .cartao-eleicao { cursor: default; break-inside: avoid; }
    body { -webkit-print-color-adjust: exact; print-color-adjust: exact; }
    .grade-semanas { grid-template-columns: repeat(4, 1fr); gap: 10px; }
    #main { margin-top: 0; padding: 12px; }
  }
</style>
</head>
<body>

<!-- HEADER -->
<header id="header">
  <h1>Planejamento Eleitoral 2026</h1>
  <div id="header-right">
    <span id="status-salvo"></span>
    <button id="badge-modo" class="visualizacao" onclick="clicarModo()">👁 Visualização</button>
    <span class="pilula-candidata">Leatrice Bez 15104</span>
  </div>
</header>

<!-- MODAL TOKEN -->
<div id="modal-token">
  <div class="modal-box">
    <h3>🔐 Modo Editor</h3>
    <p>
      Cole abaixo o seu <strong>token do GitHub</strong>.<br>
      Para obtê-lo, abra o terminal e execute:<br>
      <code style="background:#f5f5f5;padding:2px 6px;border-radius:4px;font-size:0.78rem">gh auth token</code><br><br>
      O token fica salvo só no seu navegador e nunca vai para o código.
    </p>
    <input type="password" id="input-token" placeholder="ghp_... ou gho_..." autocomplete="off">
    <div id="erro-token"></div>
    <div class="modal-acoes">
      <button class="btn btn-outline" onclick="fecharModal()">Cancelar</button>
      <button class="btn btn-azul" onclick="validarToken()">Entrar como editor</button>
    </div>
  </div>
</div>

<!-- MAIN -->
<div id="main">

  <!-- VISÃO GERAL -->
  <div id="visao-geral" class="ativo">
    <div id="barra-acoes">
      <button class="btn btn-azul" onclick="exportarBackup()">⬇ Exportar backup</button>
      <label class="btn btn-outline" style="cursor:pointer">
        ⬆ Importar backup
        <input type="file" accept=".json" style="display:none" onchange="importarBackup(event)">
      </label>
      <button class="btn btn-laranja" onclick="imprimirPlanner()">🖨 Imprimir</button>
    </div>
    <div class="grade-semanas" id="grade-semanas"></div>
  </div>

  <!-- TELA SEMANA (página 2: lista de dias) -->
  <div id="tela-semana">
    <div style="margin-bottom:14px">
      <button class="btn-voltar" onclick="voltarVisaoGeral()">← Voltar para a visão geral</button>
    </div>
    <div class="semana-nav">
      <button class="btn btn-outline" id="btn-sem-ant" onclick="navegarSemana(-1)">‹ Anterior</button>
      <h2 id="titulo-semana">Semana <span id="periodo-semana"></span></h2>
      <button class="btn btn-outline" id="btn-prox-sem" onclick="navegarSemana(1)">Próxima ›</button>
    </div>
    <div id="cards-dias"></div>
  </div>

  <!-- TELA DIA (página 3: horários do dia) -->
  <div id="tela-dia">
    <div style="margin-bottom:14px">
      <button class="btn-voltar" id="btn-voltar-semana" onclick="voltarTelaSemana()">← Voltar para a semana</button>
    </div>
    <div id="conteudo-dia"></div>
  </div>

  <!-- TELA ELEIÇÃO -->
  <div id="tela-eleicao">
    <div style="margin-bottom:14px">
      <button class="btn-voltar" onclick="voltarVisaoGeral()">← Voltar para a visão geral</button>
    </div>
    <div class="bloco-eleicao">
      <div class="bloco-eleicao-header">🗳 Dia da Eleição — 4 de outubro de 2026 (domingo)</div>
      <div class="bloco-eleicao-campos" id="campos-eleicao"></div>
    </div>
  </div>

</div>

<!-- INDICADOR SYNC -->
<div id="sync-status">
  <div class="sync-dot" id="sync-dot"></div>
  <span id="sync-texto">Conectando…</span>
</div>

<!-- RODAPÉ -->
<div id="rodape">
  <span id="texto-rodape">—</span>
</div>

<script>
// ===================================================
// CONFIG
// ===================================================
const GIST_ID   = '07f4d28e04fdb4b42ba1c17e5d067913';
const GIST_FILE = 'planner_dados.json';
const GIST_API  = `https://api.github.com/gists/${GIST_ID}`;
const CHAVE_LS  = 'planner_leatrice_2026';
const CHAVE_TK  = 'planner_leatrice_token';

// ===================================================
// DADOS DAS SEMANAS
// ===================================================
const SEMANAS = [
  { num: 1, periodo: '16 a 22 de agosto de 2026',            inicio: '2026-08-16' },
  { num: 2, periodo: '23 a 29 de agosto de 2026',             inicio: '2026-08-23' },
  { num: 3, periodo: '30 de agosto a 5 de setembro de 2026',  inicio: '2026-08-30' },
  { num: 4, periodo: '6 a 12 de setembro de 2026',            inicio: '2026-09-06' },
  { num: 5, periodo: '13 a 19 de setembro de 2026',           inicio: '2026-09-13' },
  { num: 6, periodo: '20 a 26 de setembro de 2026',           inicio: '2026-09-20' },
  { num: 7, periodo: '27 de setembro a 3 de outubro de 2026', inicio: '2026-09-27' },
];
const ABREVS       = ['DOM','SEG','TER','QUA','QUI','SEX','SÁB'];
const DIAS_SEMANA  = ['Domingo','Segunda-feira','Terça-feira','Quarta-feira','Quinta-feira','Sexta-feira','Sábado'];
const MESES        = ['jan','fev','mar','abr','mai','jun','jul','ago','set','out','nov','dez'];
const HORAS = [];
for (let h = 6; h <= 24; h++) HORAS.push(String(h).padStart(2,'0') + ':00');

const CAMPOS_ELEICAO = [
  { key: 'cidadeBase',          label: 'Cidade base' },
  { key: 'coordenador',         label: 'Coordenador responsável' },
  { key: 'equipe',              label: 'Equipe / Apoio' },
  { key: 'horarioDeslocamento', label: 'Horário de deslocamento' },
  { key: 'observacoes',         label: 'Observações' },
];

function datasDaSemana(iso) {
  const dias = [];
  const base = new Date(iso + 'T12:00:00Z');
  for (let i = 0; i < 7; i++) {
    const d = new Date(base);
    d.setUTCDate(d.getUTCDate() + i);
    dias.push(d.toISOString().slice(0, 10));
  }
  return dias;
}

// ===================================================
// ESTADO
// ===================================================
let estado = estadoVazio();
let modoEditor = false;
let tokenEditor = localStorage.getItem(CHAVE_TK) || '';
let saveTimer = null;
let semanaAtual = 0;
let telaAtiva = 'visao-geral';
let ultimaVersaoRemota = '';
let syncInterval = null;

function estadoVazio() {
  return { versao: 1, atualizadoEm: new Date(0).toISOString(), dias: {}, eleicao: {} };
}

// ===================================================
// SINCRONIZAÇÃO (LEITURA)
// ===================================================
async function lerGist() {
  setSyncStatus('sync', 'Sincronizando…');
  try {
    // Usa a API (sem CDN) para sempre receber dados frescos
    const r = await fetch(GIST_API, {
      headers: { 'Accept': 'application/vnd.github+json', 'X-GitHub-Api-Version': '2022-11-28' }
    });
    if (!r.ok) throw new Error('HTTP ' + r.status);
    const gist = await r.json();
    const txt = gist.files[GIST_FILE]?.content || '{}';
    // Só aplica se mudou
    if (txt === ultimaVersaoRemota) { setSyncStatus('ok', 'Atualizado'); return; }
    ultimaVersaoRemota = txt;
    const remoto = JSON.parse(txt);
    if (!estado.atualizadoEm || new Date(remoto.atualizadoEm) >= new Date(estado.atualizadoEm)) {
      estado = remoto;
      localStorage.setItem(CHAVE_LS, txt);
      reRenderTela();
    }
    setSyncStatus('ok', 'Atualizado');
  } catch(e) {
    setSyncStatus('erro', 'Sem conexão');
  }
}

async function escreverGist(token) {
  const conteudo = JSON.stringify(estado, null, 2);
  const r = await fetch(GIST_API, {
    method: 'PATCH',
    headers: { Authorization: 'token ' + token, 'Content-Type': 'application/json' },
    body: JSON.stringify({ files: { [GIST_FILE]: { content: conteudo } } }),
  });
  if (!r.ok) throw new Error('HTTP ' + r.status);
  ultimaVersaoRemota = conteudo;
}

function setSyncStatus(estado, texto) {
  const dot = document.getElementById('sync-dot');
  dot.className = 'sync-dot ' + estado;
  document.getElementById('sync-texto').textContent = texto;
}

function iniciarSync() {
  lerGist();
  syncInterval = setInterval(lerGist, 30000);
}

// ===================================================
// MODO EDITOR
// ===================================================
function clicarModo() {
  if (modoEditor) {
    // Sair do modo editor
    modoEditor = false;
    tokenEditor = '';
    localStorage.removeItem(CHAVE_TK);
    atualizarBadgeModo();
    reRenderTela();
  } else {
    // Tentar entrar no modo editor
    if (tokenEditor) {
      ativarModoEditor(tokenEditor);
    } else {
      document.getElementById('modal-token').classList.add('visivel');
      setTimeout(() => document.getElementById('input-token').focus(), 50);
    }
  }
}

async function validarToken() {
  const tk = document.getElementById('input-token').value.trim();
  const erro = document.getElementById('erro-token');
  if (!tk) { erro.textContent = 'Cole o token antes de continuar.'; return; }
  erro.textContent = 'Verificando…';
  try {
    // Tenta escrever o estado atual no gist com esse token
    await escreverGist(tk);
    tokenEditor = tk;
    localStorage.setItem(CHAVE_TK, tk);
    fecharModal();
    ativarModoEditor(tk);
  } catch(e) {
    erro.textContent = 'Token inválido ou sem permissão. Tente novamente.';
  }
}

function ativarModoEditor(tk) {
  tokenEditor = tk;
  modoEditor = true;
  // Para o sync automático enquanto edita (ela é a fonte de verdade)
  clearInterval(syncInterval);
  syncInterval = null;
  atualizarBadgeModo();
  setSyncStatus('ok', 'Modo editor ativo');
  reRenderTela();
}

function fecharModal() {
  document.getElementById('modal-token').classList.remove('visivel');
  document.getElementById('input-token').value = '';
  document.getElementById('erro-token').textContent = '';
}

function atualizarBadgeModo() {
  const b = document.getElementById('badge-modo');
  if (modoEditor) {
    b.className = 'editor';
    b.textContent = '✏️ Editor — Clique para sair';
  } else {
    b.className = 'visualizacao';
    b.textContent = '👁 Visualização';
  }
}

// ===================================================
// PERSISTÊNCIA LOCAL + REMOTA
// ===================================================
function salvarEstado() {
  estado.atualizadoEm = new Date().toISOString();
  const json = JSON.stringify(estado);
  localStorage.setItem(CHAVE_LS, json);
  atualizarStatusSalvo('salvando');
  if (modoEditor && tokenEditor) {
    setSyncStatus('sync', 'Salvando…');
    escreverGist(tokenEditor)
      .then(() => { setSyncStatus('ok', 'Salvo'); atualizarStatusSalvo('ok'); })
      .catch(() => { setSyncStatus('erro', 'Erro ao salvar'); });
  }
}

function agendarSalvamento() {
  clearTimeout(saveTimer);
  saveTimer = setTimeout(salvarEstado, 500);
}

function atualizarStatusSalvo(tipo) {
  const agora = new Date();
  const hh = String(agora.getHours()).padStart(2,'0');
  const mm = String(agora.getMinutes()).padStart(2,'0');
  const el = document.getElementById('status-salvo');
  if (tipo === 'salvando') el.textContent = 'Salvando…';
  else el.textContent = `Salvo às ${hh}:${mm}`;
}

// ===================================================
// NAVEGAÇÃO
// ===================================================
let diaAtual = null; // ISO string do dia aberto

function mostrarTela(tela) {
  ['visao-geral','tela-semana','tela-dia','tela-eleicao'].forEach(id =>
    document.getElementById(id).classList.remove('ativo'));
  document.getElementById(tela).classList.add('ativo');
  telaAtiva = tela;
}

function reRenderTela() {
  if (telaAtiva === 'visao-geral') renderizarVisaoGeral();
  else if (telaAtiva === 'tela-semana') renderizarTelaSemana();
  else if (telaAtiva === 'tela-dia') renderizarTelaDia();
  else if (telaAtiva === 'tela-eleicao') renderizarTelaEleicao();
}

function abrirSemana(idx) {
  semanaAtual = idx;
  renderizarTelaSemana();
  mostrarTela('tela-semana');
  window.scrollTo(0, 0);
}

function abrirDia(dataIso) {
  diaAtual = dataIso;
  renderizarTelaDia();
  mostrarTela('tela-dia');
  window.scrollTo(0, 0);
}

function abrirEleicao() {
  renderizarTelaEleicao();
  mostrarTela('tela-eleicao');
  window.scrollTo(0, 0);
}

function voltarVisaoGeral() {
  renderizarVisaoGeral();
  mostrarTela('visao-geral');
  window.scrollTo(0, 0);
  if (!modoEditor && !syncInterval) iniciarSync();
}

function voltarTelaSemana() {
  renderizarTelaSemana();
  mostrarTela('tela-semana');
  window.scrollTo(0, 0);
}

function navegarSemana(delta) {
  const novo = semanaAtual + delta;
  if (novo < 0 || novo >= SEMANAS.length) return;
  semanaAtual = novo;
  renderizarTelaSemana();
  window.scrollTo(0, 0);
}

document.addEventListener('keydown', e => {
  if (e.key === 'Escape') {
    if (document.getElementById('modal-token').classList.contains('visivel')) fecharModal();
    else if (telaAtiva === 'tela-dia') voltarTelaSemana();
    else if (telaAtiva !== 'visao-geral') voltarVisaoGeral();
  }
});

// ===================================================
// VISÃO GERAL
// ===================================================
function renderizarVisaoGeral() {
  const grade = document.getElementById('grade-semanas');
  grade.innerHTML = '';

  SEMANAS.forEach((sem, idx) => {
    const datas = datasDaSemana(sem.inicio);
    const preenchidos = datas.filter(d => {
      const dia = estado.dias[d];
      if (!dia) return false;
      const temHoras = dia.horas && Object.keys(dia.horas).length > 0;
      return dia.cidade || dia.coordenador || temHoras;
    }).length;

    const cartao = document.createElement('div');
    cartao.className = 'cartao-semana';
    cartao.onclick = () => abrirSemana(idx);

    cartao.innerHTML = `
      <div class="cartao-header">
        <div class="circulo-sem"><span class="label-sem">SEM</span><span class="num-sem">${sem.num}</span></div>
        <div class="cartao-header-info">
          <div class="cartao-header-titulo">Roteiro Semanal</div>
          <div class="cartao-header-periodo">${sem.periodo}</div>
        </div>
        <div class="pilula-contador">${preenchidos}/7 dias</div>
      </div>
    `;

    const lista = document.createElement('div');
    lista.className = 'lista-dias';
    datas.forEach(dataIso => {
      const d = new Date(dataIso + 'T12:00:00Z');
      const abrev = ABREVS[d.getUTCDay()];
      const numDia = d.getUTCDate();
      const diaDados = estado.dias[dataIso] || {};
      const horas = diaDados.horas || {};
      const horasPreenchidas = HORAS.filter(h => horas['h' + h.replace(':','')]);
      const tem = diaDados.cidade || diaDados.coordenador || horasPreenchidas.length > 0;

      const linha = document.createElement('div');
      linha.className = 'linha-dia';
      linha.innerHTML = `
        <div class="badge-dia"><div class="abrev">${abrev}</div><div class="num-dia">${numDia}</div></div>
        <div class="resumo-dia">
          ${tem ? `
            ${diaDados.cidade      ? `<div class="resumo-cidade">${esc(diaDados.cidade)}</div>` : ''}
            ${diaDados.coordenador ? `<div class="resumo-coord">${esc(diaDados.coordenador)}</div>` : ''}
            ${horasPreenchidas.length > 0 ? `<div class="resumo-ativ">${horasPreenchidas.map(h => {
              const chave = 'h' + h.replace(':','');
              return `<span style="margin-right:8px"><b>${h}</b> ${esc(horas[chave])}</span>`;
            }).join('')}</div>` : ''}
          ` : '<div class="resumo-vazio">— sem definição —</div>'}
        </div>`;
      lista.appendChild(linha);
    });
    cartao.appendChild(lista);
    grade.appendChild(cartao);
  });

  // Cartão eleição
  const el = estado.eleicao || {};
  const temEl = CAMPOS_ELEICAO.some(c => el[c.key]);
  const cartaoEl = document.createElement('div');
  cartaoEl.className = 'cartao-eleicao';
  cartaoEl.onclick = abrirEleicao;
  cartaoEl.innerHTML = `
    <div class="cartao-eleicao-header">
      <div class="circulo-el"><span class="label-el">4/OUT</span><span class="num-el">🗳</span></div>
      <div class="cartao-header-info" style="color:#fff">
        <div class="cartao-header-titulo">Dia da Eleição</div>
        <div class="cartao-header-periodo">4 de outubro de 2026 • Domingo</div>
      </div>
    </div>
    <div class="cartao-eleicao-body" id="resumo-eleicao"></div>`;
  grade.appendChild(cartaoEl);

  const resumoEl = document.getElementById('resumo-eleicao');
  if (temEl) {
    CAMPOS_ELEICAO.forEach(c => {
      if (!el[c.key]) return;
      resumoEl.innerHTML += `<div class="campo-el-resumo"><div class="campo-el-label">${esc(c.label)}</div><div class="campo-el-valor">${esc(el[c.key])}</div></div>`;
    });
  } else {
    resumoEl.innerHTML = '<div class="campo-el-vazio">— clique para preencher —</div>';
  }
}

// ===================================================
// TELA SEMANA
// ===================================================
// ===================================================
// PÁGINA 2 — LISTA DE DIAS DA SEMANA
// ===================================================
function renderizarTelaSemana() {
  const sem = SEMANAS[semanaAtual];
  const datas = datasDaSemana(sem.inicio);
  document.getElementById('titulo-semana').childNodes[0].textContent = `Semana ${sem.num} — `;
  document.getElementById('periodo-semana').textContent = sem.periodo;
  document.getElementById('btn-sem-ant').disabled = semanaAtual === 0;
  document.getElementById('btn-prox-sem').disabled = semanaAtual === SEMANAS.length - 1;

  const container = document.getElementById('cards-dias');
  container.innerHTML = '';

  datas.forEach(dataIso => {
    const d = new Date(dataIso + 'T12:00:00Z');
    const diaDados = estado.dias[dataIso] || {};
    const horas = diaDados.horas || {};
    const horasPreenchidas = HORAS.filter(h => horas['h' + h.replace(':','')]);
    const ro = modoEditor ? '' : 'readonly';

    const card = document.createElement('div');
    card.className = 'card-dia';

    const faixa = document.createElement('div');
    faixa.className = 'card-dia-faixa';
    faixa.style.cursor = 'pointer';
    faixa.innerHTML = `<div class="ds">${ABREVS[d.getUTCDay()]}</div><div class="dd">${d.getUTCDate()}</div><div class="dm">${MESES[d.getUTCMonth()]}</div>`;
    faixa.onclick = () => abrirDia(dataIso);

    const corpo = document.createElement('div');
    corpo.className = 'card-dia-corpo';
    corpo.style.gap = '8px';
    corpo.innerHTML = `
      <div style="display:flex;gap:16px;align-items:flex-end;">
        <div style="flex:1">
          <label class="campo-label" style="font-size:0.58rem">Cidade</label>
          <input class="campo-input" type="text" data-key="cidade" data-date="${dataIso}"
            value="${esc(diaDados.cidade||'')}"
            placeholder="${modoEditor ? 'Informe a cidade…' : '—'}" ${ro}
            style="font-size:0.84rem">
        </div>
        <div style="flex:1">
          <label class="campo-label" style="font-size:0.58rem">Coordenador</label>
          <input class="campo-input" type="text" data-key="coordenador" data-date="${dataIso}"
            value="${esc(diaDados.coordenador||'')}"
            placeholder="${modoEditor ? 'Nome do coordenador…' : '—'}" ${ro}
            style="font-size:0.84rem">
        </div>
      </div>
      ${horasPreenchidas.length > 0
        ? `<div class="card-dia-horas">${horasPreenchidas.map(h => esc(h)).join(' · ')}</div>`
        : ''}`;

    const seta = document.createElement('div');
    seta.className = 'card-dia-seta';
    seta.style.cursor = 'pointer';
    seta.innerHTML = '›';
    seta.title = 'Abrir horários';
    seta.onclick = () => abrirDia(dataIso);

    if (modoEditor) {
      corpo.querySelectorAll('[data-key]').forEach(inp => {
        inp.addEventListener('input', e => {
          const date = e.target.dataset.date;
          const key  = e.target.dataset.key;
          if (!estado.dias[date]) estado.dias[date] = {};
          estado.dias[date][key] = e.target.value;
          limparDiaSeVazio(date);
          agendarSalvamento();
        });
        // impede que clique no input abra o dia
        inp.addEventListener('click', e => e.stopPropagation());
      });
    }

    card.appendChild(faixa);
    card.appendChild(corpo);
    card.appendChild(seta);
    container.appendChild(card);
  });
}

// ===================================================
// PÁGINA 3 — HORÁRIOS DE UM DIA
// ===================================================
function renderizarTelaDia() {
  const dataIso = diaAtual;
  const d = new Date(dataIso + 'T12:00:00Z');
  const sem = SEMANAS[semanaAtual];
  const diaDados = estado.dias[dataIso] || {};
  const horas = diaDados.horas || {};
  const ro = modoEditor ? '' : 'readonly';

  document.getElementById('btn-voltar-semana').textContent = `← Semana ${sem.num} — ${sem.periodo}`;

  const container = document.getElementById('conteudo-dia');
  container.innerHTML = '';

  // Título do dia
  const titulo = document.createElement('div');
  titulo.style.cssText = 'display:flex;align-items:center;justify-content:space-between;margin-bottom:14px;';
  titulo.innerHTML = `
    <h2 style="font-size:1rem;color:var(--azul-escuro);">
      ${DIAS_SEMANA[d.getUTCDay()]}, ${d.getUTCDate()} de ${MESES[d.getUTCMonth()].replace('ago','agosto').replace('set','setembro').replace('out','outubro')}
    </h2>
    <button class="btn-limpar-dia" onclick="limparDia('${dataIso}')" ${modoEditor ? '' : 'disabled'}>Limpar dia</button>`;
  container.appendChild(titulo);

  // Bloco cidade + coordenador
  const cab = document.createElement('div');
  cab.style.cssText = 'display:flex;gap:20px;margin-bottom:16px;padding:14px 16px;border:1px solid var(--linha-div);border-radius:8px;background:#fff;';
  cab.innerHTML = `
    <div style="flex:1">
      <label class="campo-label">Cidade</label>
      <input class="campo-input" type="text" data-key="cidade" data-date="${dataIso}" value="${esc(diaDados.cidade||'')}" placeholder="${modoEditor ? 'Informe a cidade…' : ''}" ${ro}>
    </div>
    <div style="flex:1">
      <label class="campo-label">Coordenador responsável</label>
      <input class="campo-input" type="text" data-key="coordenador" data-date="${dataIso}" value="${esc(diaDados.coordenador||'')}" placeholder="${modoEditor ? 'Nome do coordenador…' : ''}" ${ro}>
    </div>`;
  container.appendChild(cab);

  // Grade de horários
  const gradeWrap = document.createElement('div');
  gradeWrap.style.cssText = 'border:1px solid var(--linha-div);border-radius:8px;overflow:hidden;';
  const grade = document.createElement('div');
  grade.className = 'grade-horas';
  HORAS.forEach(hora => {
    const chave = 'h' + hora.replace(':','');
    const linha = document.createElement('div');
    linha.className = 'linha-hora';
    linha.innerHTML = `
      <div class="celula-hora">${hora}</div>
      <div class="celula-atividade">
        <input type="text" data-hora="${chave}" data-date="${dataIso}" value="${esc(horas[chave]||'')}" placeholder="${modoEditor ? '…' : ''}" ${ro}>
      </div>`;
    grade.appendChild(linha);
  });
  gradeWrap.appendChild(grade);
  container.appendChild(gradeWrap);

  // Eventos de edição
  if (modoEditor) {
    cab.querySelectorAll('[data-key]').forEach(inp => {
      inp.addEventListener('input', e => {
        const date = e.target.dataset.date;
        const key  = e.target.dataset.key;
        if (!estado.dias[date]) estado.dias[date] = {};
        estado.dias[date][key] = e.target.value;
        limparDiaSeVazio(date);
        agendarSalvamento();
      });
    });
    grade.querySelectorAll('[data-hora]').forEach(inp => {
      inp.addEventListener('input', e => {
        const date = e.target.dataset.date;
        const chave = e.target.dataset.hora;
        if (!estado.dias[date]) estado.dias[date] = {};
        if (!estado.dias[date].horas) estado.dias[date].horas = {};
        if (e.target.value) estado.dias[date].horas[chave] = e.target.value;
        else delete estado.dias[date].horas[chave];
        limparDiaSeVazio(date);
        agendarSalvamento();
      });
    });
  }
}

function limparDiaSeVazio(date) {
  const d = estado.dias[date];
  if (!d) return;
  const temHoras = d.horas && Object.keys(d.horas).length > 0;
  if (!d.cidade && !d.coordenador && !temHoras) delete estado.dias[date];
}

function limparDia(dataIso) {
  if (!modoEditor) return;
  if (!confirm('Apagar todos os dados deste dia?')) return;
  delete estado.dias[dataIso];
  salvarEstado();
  renderizarTelaDia();
}

// ===================================================
// TELA ELEIÇÃO
// ===================================================
function renderizarTelaEleicao() {
  const container = document.getElementById('campos-eleicao');
  container.innerHTML = '';
  const el = estado.eleicao || {};
  const ro = modoEditor ? '' : 'readonly';

  CAMPOS_ELEICAO.forEach(c => {
    const isLonga = c.key === 'observacoes' || c.key === 'equipe';
    const grupo = document.createElement('div');
    grupo.className = 'campo-grupo';
    grupo.innerHTML = `
      <label class="campo-label">${esc(c.label)}</label>
      ${isLonga
        ? `<textarea class="campo-textarea" data-el-key="${c.key}" ${ro} placeholder="${modoEditor ? '…' : ''}" rows="2">${esc(el[c.key]||'')}</textarea>`
        : `<input class="campo-input" type="text" data-el-key="${c.key}" value="${esc(el[c.key]||'')}" placeholder="${modoEditor ? '…' : ''}" ${ro}>`
      }`;
    container.appendChild(grupo);
  });

  if (modoEditor) {
    container.querySelectorAll('[data-el-key]').forEach(inp => {
      inp.addEventListener('input', e => {
        if (!estado.eleicao) estado.eleicao = {};
        estado.eleicao[e.target.dataset.elKey] = e.target.value;
        agendarSalvamento();
        if (inp.tagName === 'TEXTAREA') autoResize(inp);
      });
      if (inp.tagName === 'TEXTAREA') autoResize(inp);
    });
  } else {
    container.querySelectorAll('textarea').forEach(autoResize);
  }
}

// ===================================================
// EXPORTAR / IMPORTAR
// ===================================================
function exportarBackup() {
  const hoje = new Date().toISOString().slice(0, 10);
  const blob = new Blob([JSON.stringify(estado, null, 2)], { type: 'application/json' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = `planner_leatrice_${hoje}.json`;
  a.click();
}

function importarBackup(event) {
  if (!modoEditor) { alert('Ative o modo editor para importar.'); event.target.value = ''; return; }
  const file = event.target.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = e => {
    try {
      const dados = JSON.parse(e.target.result);
      if (!dados.versao || !dados.dias) throw new Error();
      if (!confirm('Substituir todos os dados pelo backup selecionado?')) return;
      estado = dados;
      salvarEstado();
      renderizarVisaoGeral();
      mostrarTela('visao-geral');
      alert('Backup importado com sucesso!');
    } catch { alert('Arquivo inválido ou corrompido.'); }
  };
  reader.readAsText(file);
  event.target.value = '';
}

function imprimirPlanner() {
  if (telaAtiva !== 'visao-geral') voltarVisaoGeral();
  setTimeout(() => window.print(), 100);
}

// ===================================================
// UTILITÁRIOS
// ===================================================
function esc(str) {
  return String(str || '')
    .replace(/&/g, '&amp;').replace(/</g, '&lt;')
    .replace(/>/g, '&gt;').replace(/"/g, '&quot;');
}

// ===================================================
// INICIALIZAÇÃO
// ===================================================
// Carregar dados locais enquanto espera o gist
const localRaw = localStorage.getItem(CHAVE_LS);
if (localRaw) { try { estado = JSON.parse(localRaw); } catch {} }

// Se já tem token salvo, ativar modo editor automaticamente
if (tokenEditor) {
  modoEditor = true;
  atualizarBadgeModo();
  setSyncStatus('ok', 'Modo editor ativo');
} else {
  iniciarSync();
}

renderizarVisaoGeral();
atualizarStatusSalvo('ok');
</script>
