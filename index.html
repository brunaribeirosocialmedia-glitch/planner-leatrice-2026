<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Planejamento Eleitoral 2026 — Leatrice Bez</title>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: system-ui, 'Segoe UI', Arial, sans-serif;
    background: #FFFFFF;
    color: #073F67;
    min-height: 100vh;
  }
  :root {
    --laranja: #F58220;
    --azul: #0878B9;
    --azul-escuro: #073F67;
    --fundo-alternado: #EAF5FB;
    --linha-div: #DCE7EC;
    --creme: #FFF1E5;
    --cinza-linha: #8AA2B0;
    --ambar: #B9770E;
    --ambar-fundo: #FFF8EC;
    --ambar-borda: #E8A33D;
  }

  /* ===== HEADER ===== */
  #header {
    position: fixed; top: 0; left: 0; right: 0; z-index: 100;
    background: #fff;
    border-bottom: 3px solid var(--laranja);
    padding: 8px 20px;
    display: flex; align-items: center; justify-content: space-between;
    box-shadow: 0 2px 8px rgba(0,0,0,0.08);
    gap: 10px;
  }
  #header h1 { font-size: 1.05rem; font-weight: 700; color: var(--azul-escuro); letter-spacing: 0.06em; text-transform: uppercase; }
  #header-right { display: flex; align-items: center; gap: 8px; flex-shrink: 0; }
  .pilula-candidata { background: var(--azul); color: #fff; font-size: 0.75rem; font-weight: 700; letter-spacing: 0.05em; padding: 5px 12px; border-radius: 20px; }

  /* Botão de login / modo editor */
  #badge-modo {
    font-size: 0.7rem; font-weight: 700; padding: 4px 10px; border-radius: 12px;
    cursor: pointer; border: none; letter-spacing: 0.04em; transition: all 0.15s;
  }
  #badge-modo.visualizacao { background: var(--fundo-alternado); color: var(--cinza-linha); border: 1.5px solid var(--linha-div); }
  #badge-modo.editor { background: #e8f5e9; color: #2e7d32; border: 1.5px solid #a5d6a7; }

  /* Aviso de acesso encerrado */
  #aviso-acesso {
    display: none; position: fixed; top: 54px; right: 20px; z-index: 150;
    background: #fff; border: 1.5px solid #c0392b; color: #c0392b;
    font-size: 0.75rem; padding: 8px 14px; border-radius: 6px;
    box-shadow: 0 4px 14px rgba(0,0,0,0.14); max-width: 320px;
  }
  #aviso-acesso.visivel { display: block; }

  /* ===== MAIN ===== */
  #main { margin-top: 60px; padding: 18px 20px 60px; }

  /* ===== BOTÕES ===== */
  .btn { font-family: inherit; font-size: 0.76rem; font-weight: 600; letter-spacing: 0.04em; text-transform: uppercase; padding: 7px 14px; border-radius: 6px; border: none; cursor: pointer; transition: opacity 0.15s; }
  .btn:hover { opacity: 0.85; }
  .btn:disabled { opacity: 0.35; cursor: not-allowed; }
  .btn-azul { background: var(--azul); color: #fff; }
  .btn-laranja { background: var(--laranja); color: #fff; }
  .btn-outline { background: transparent; color: var(--azul-escuro); border: 1.5px solid var(--linha-div); }
  .btn-outline:hover { background: var(--fundo-alternado); }
  .btn-voltar { background: var(--fundo-alternado); border: 1.5px solid var(--linha-div); border-radius: 6px; color: var(--azul); font-size: 0.85rem; font-weight: 600; cursor: pointer; padding: 8px 16px; display: inline-flex; align-items: center; gap: 6px; transition: background 0.15s; }
  .btn-voltar:hover { background: var(--linha-div); }

  /* ===== BARRA DE AÇÕES ===== */
  #barra-acoes { display: flex; gap: 8px; margin-bottom: 18px; flex-wrap: wrap; align-items: center; }

  /* ===== GRADE ===== */
  .grade-semanas { display: grid; grid-template-columns: repeat(4, 1fr); gap: 14px; }

  /* ===== CARTÃO SEMANA ===== */
  .cartao-semana { border-radius: 8px; overflow: hidden; border: 1px solid var(--linha-div); cursor: pointer; transition: box-shadow 0.15s; }
  .cartao-semana:hover { box-shadow: 0 4px 16px rgba(7,63,103,0.12); }
  .cartao-header { background: var(--azul); color: #fff; padding: 10px 12px 8px; display: flex; align-items: flex-start; gap: 10px; min-height: 90px; }
  .circulo-sem { background: var(--laranja); border-radius: 50%; width: 42px; height: 42px; display: flex; flex-direction: column; align-items: center; justify-content: center; flex-shrink: 0; line-height: 1.1; margin-top: 2px; }
  .circulo-sem .label-sem { font-size: 0.55rem; font-weight: 700; letter-spacing: 0.08em; text-transform: uppercase; }
  .circulo-sem .num-sem { font-size: 1.1rem; font-weight: 800; }
  .cartao-header-info { flex: 1; }
  .cartao-header-titulo { font-size: 0.68rem; font-weight: 700; letter-spacing: 0.1em; text-transform: uppercase; opacity: 0.9; }
  .cartao-header-periodo { font-size: 0.65rem; opacity: 0.8; margin-top: 2px; }
  .pilula-contador { background: rgba(255,255,255,0.2); color: #fff; font-size: 0.63rem; font-weight: 700; padding: 3px 7px; border-radius: 10px; white-space: nowrap; }
  .autoria { font-size: 0.58rem; color: #fff; opacity: 0.8; margin-top: 4px; font-style: italic; }
  .autoria.autoria-clara { color: var(--cinza-linha); opacity: 1; }

  /* ===== LINHAS DE DIA (CARTÃO) ===== */
  .linha-dia { display: flex; align-items: center; gap: 10px; padding: 7px 10px; border-bottom: 1px solid var(--linha-div); min-height: 50px; }
  .linha-dia:last-child { border-bottom: none; }
  .linha-dia:nth-child(even) { background: var(--fundo-alternado); }
  .linha-dia:nth-child(odd) { background: #fff; }
  .badge-dia { background: var(--laranja); color: #fff; border-radius: 6px; width: 34px; min-width: 34px; padding: 3px 0; text-align: center; flex-shrink: 0; line-height: 1.2; }
  .badge-dia .abrev { font-size: 0.56rem; font-weight: 700; letter-spacing: 0.04em; }
  .badge-dia .num-dia { font-size: 0.88rem; font-weight: 800; }
  .resumo-dia { flex: 1; overflow: hidden; }
  .resumo-cidade { font-size: 0.76rem; font-weight: 700; color: var(--azul-escuro); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .resumo-coord, .resumo-ativ { font-size: 0.66rem; color: var(--cinza-linha); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .resumo-vazio { font-size: 0.7rem; color: var(--cinza-linha); font-style: italic; }

  /* ===== CARTÃO ELEIÇÃO ===== */
  .cartao-eleicao { border-radius: 8px; overflow: hidden; border: 2px solid var(--laranja); cursor: pointer; transition: box-shadow 0.15s; background: var(--creme); }
  .cartao-eleicao:hover { box-shadow: 0 4px 16px rgba(245,130,32,0.2); }
  .cartao-eleicao-header { background: var(--laranja); color: #fff; padding: 10px 14px 8px; display: flex; align-items: center; gap: 10px; }
  .circulo-el { background: #fff; color: var(--laranja); border-radius: 50%; width: 42px; height: 42px; display: flex; flex-direction: column; align-items: center; justify-content: center; flex-shrink: 0; line-height: 1.1; }
  .circulo-el .label-el { font-size: 0.55rem; font-weight: 700; letter-spacing: 0.06em; }
  .circulo-el .num-el { font-size: 1rem; font-weight: 800; }
  .cartao-eleicao-body { padding: 10px 14px; }
  .campo-el-resumo { margin-bottom: 6px; }
  .campo-el-label { font-size: 0.6rem; font-weight: 700; color: var(--laranja); letter-spacing: 0.08em; text-transform: uppercase; }
  .campo-el-valor { font-size: 0.76rem; color: var(--azul-escuro); font-weight: 600; }
  .campo-el-vazio { font-size: 0.7rem; color: var(--cinza-linha); font-style: italic; }

  /* ===== TELAS ===== */
  #visao-geral { display: none; }
  #visao-geral.ativo { display: block; }
  #tela-semana { display: none; }
  #tela-semana.ativo { display: block; }
  #tela-dia { display: none; }
  #tela-dia.ativo { display: block; }
  #tela-eleicao { display: none; }
  #tela-eleicao.ativo { display: block; }

  /* ===== CARDS DE DIA (página 2) ===== */
  .card-dia { display: flex; align-items: stretch; border: 1px solid var(--linha-div); border-radius: 8px; overflow: hidden; margin-bottom: 10px; cursor: pointer; transition: box-shadow 0.15s; }
  .card-dia:hover { box-shadow: 0 3px 12px rgba(7,63,103,0.12); }
  .card-dia-faixa { background: var(--laranja); color: #fff; width: 80px; min-width: 80px; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 12px 4px; text-align: center; line-height: 1.3; }
  .card-dia-faixa .ds { font-size: 0.65rem; font-weight: 700; letter-spacing: 0.06em; text-transform: uppercase; }
  .card-dia-faixa .dd { font-size: 1rem; font-weight: 800; margin-top: 3px; }
  .card-dia-faixa .dm { font-size: 0.56rem; opacity: 0.85; margin-top: 1px; }
  .card-dia-corpo { flex: 1; padding: 12px 16px; background: #fff; display: flex; flex-direction: column; justify-content: center; gap: 4px; }
  .card-dia-cidade { font-size: 0.85rem; font-weight: 700; color: var(--azul-escuro); }
  .card-dia-coord  { font-size: 0.73rem; color: var(--cinza-linha); }
  .card-dia-horas  { font-size: 0.7rem; color: var(--azul); margin-top: 2px; }
  .card-dia-vazio  { font-size: 0.73rem; color: var(--cinza-linha); font-style: italic; }
  .card-dia-seta   { display: flex; align-items: center; padding: 0 14px; color: var(--cinza-linha); font-size: 1.1rem; }

  /* ===== NAV SEMANA ===== */
  .semana-nav { display: flex; align-items: center; justify-content: space-between; margin-bottom: 16px; gap: 8px; }
  .semana-nav h2 { font-size: 0.98rem; color: var(--azul-escuro); font-weight: 700; text-align: center; flex: 1; }
  .semana-nav h2 span { display: block; font-size: 0.73rem; font-weight: 400; color: var(--cinza-linha); margin-top: 2px; }

  /* ===== BLOCOS DE DIA ===== */
  .bloco-dia { display: flex; border: 1px solid var(--linha-div); border-radius: 8px; overflow: hidden; margin-bottom: 12px; }
  .faixa-lateral { background: var(--laranja); color: #fff; width: 80px; min-width: 80px; display: flex; flex-direction: column; align-items: center; justify-content: flex-start; padding: 14px 4px 14px; text-align: center; line-height: 1.3; flex-shrink: 0; }
  .faixa-lateral .dia-semana { font-size: 0.68rem; font-weight: 700; letter-spacing: 0.06em; text-transform: uppercase; }
  .faixa-lateral .dia-data { font-size: 0.78rem; font-weight: 800; margin-top: 4px; }
  .faixa-lateral .dia-mes { font-size: 0.56rem; opacity: 0.85; margin-top: 1px; }
  .bloco-campos { flex: 1; background: #fff; position: relative; }
  /* Cabeçalho (cidade + coordenador) */
  .bloco-cabecalho { padding: 12px 16px 10px; border-bottom: 2px solid var(--linha-div); display: flex; gap: 20px; align-items: flex-end; position: relative; }
  .campo-grupo { flex: 1; }
  .campo-grupo:last-of-type { margin-bottom: 0; }
  .campo-label { display: block; font-size: 0.61rem; font-weight: 700; color: var(--azul-escuro); letter-spacing: 0.1em; text-transform: uppercase; margin-bottom: 4px; }
  .campo-input { width: 100%; font-family: inherit; font-size: 0.84rem; color: var(--azul-escuro); border: none; border-bottom: 1.5px solid var(--cinza-linha); border-radius: 0; background: transparent; padding: 4px 0; outline: none; transition: border-color 0.15s; }
  .campo-input:focus { border-bottom-color: var(--azul); }
  .campo-input[readonly] { color: var(--azul-escuro); cursor: default; border-bottom-color: var(--linha-div); }
  .campo-textarea { width: 100%; font-family: inherit; font-size: 0.84rem; color: var(--azul-escuro); border: none; border-bottom: 1.5px solid var(--cinza-linha); background: transparent; padding: 4px 0; outline: none; resize: none; overflow: hidden; min-height: 30px; line-height: 1.5; transition: border-color 0.15s; }
  .campo-textarea:focus { border-bottom-color: var(--azul); }
  .campo-textarea[readonly] { cursor: default; border-bottom-color: var(--linha-div); }
  .btn-limpar-dia { font-family: inherit; font-size: 0.63rem; color: var(--cinza-linha); background: none; border: 1px solid var(--linha-div); border-radius: 4px; padding: 3px 8px; cursor: pointer; text-transform: uppercase; letter-spacing: 0.04em; transition: color 0.15s, border-color 0.15s; white-space: nowrap; align-self: flex-start; margin-top: 2px; }
  .btn-limpar-dia:hover { color: #c0392b; border-color: #c0392b; }
  .btn-limpar-dia:disabled { display: none; }
  /* Grade de horários */
  .grade-horas { display: table; width: 100%; border-collapse: collapse; }
  .linha-hora { display: table-row; }
  .linha-hora:nth-child(even) { background: var(--fundo-alternado); }
  .celula-hora { display: table-cell; width: 56px; min-width: 56px; padding: 5px 10px; font-size: 0.75rem; font-weight: 700; color: var(--azul); border-right: 1px solid var(--linha-div); border-bottom: 1px solid var(--linha-div); vertical-align: middle; white-space: nowrap; }
  .celula-hora.meia { font-size: 0.66rem; font-weight: 400; color: var(--cinza-linha); }
  .linha-hora.meia { background: #fafcfe !important; }
  .linha-hora.meia:nth-child(even) { background: #f4f8fb !important; }
  .celula-atividade { display: table-cell; padding: 4px 8px; border-bottom: 1px solid var(--linha-div); vertical-align: middle; }
  .celula-atividade input { width: 100%; font-family: inherit; font-size: 0.82rem; color: var(--azul-escuro); border: none; background: transparent; outline: none; padding: 3px 0; }
  .celula-atividade input[readonly] { cursor: default; color: var(--azul-escuro); }

  /* ===== CONFLITO DE EDIÇÃO ===== */
  .campo-input.campo-conflito, .campo-textarea.campo-conflito, .celula-atividade input.campo-conflito {
    border-bottom-color: var(--ambar-borda) !important;
    background: var(--ambar-fundo);
  }
  .aviso-conflito {
    font-size: 0.62rem; color: var(--ambar); cursor: pointer; margin-top: 2px;
    text-decoration: underline; text-decoration-style: dotted;
  }

  /* ===== TELA ELEIÇÃO ===== */
  .bloco-eleicao { border: 2px solid var(--laranja); border-radius: 8px; overflow: hidden; max-width: 700px; margin: 0 auto; }
  .bloco-eleicao-header { background: var(--laranja); color: #fff; padding: 14px 20px; font-size: 0.98rem; font-weight: 700; letter-spacing: 0.06em; text-transform: uppercase; display: flex; align-items: center; justify-content: space-between; gap: 10px; }
  .bloco-eleicao-campos { background: var(--creme); padding: 20px; }

  /* ===== MODAIS ===== */
  #modal-login, #modal-conflito {
    display: none; position: fixed; inset: 0; z-index: 200;
    background: rgba(7,63,103,0.55); backdrop-filter: blur(3px);
    align-items: center; justify-content: center;
  }
  #modal-login.visivel, #modal-conflito.visivel { display: flex; }
  .modal-box { background: #fff; border-radius: 12px; padding: 28px 28px 24px; max-width: 460px; width: 90%; box-shadow: 0 8px 32px rgba(0,0,0,0.18); }
  .modal-box h3 { color: var(--azul-escuro); font-size: 1rem; margin-bottom: 8px; }
  .modal-box p { font-size: 0.8rem; color: var(--cinza-linha); margin-bottom: 18px; line-height: 1.5; }
  .modal-box p strong { color: var(--azul-escuro); }
  #input-codigo { width: 100%; font-family: inherit; font-size: 0.85rem; padding: 10px 12px; border: 1.5px solid var(--linha-div); border-radius: 6px; outline: none; margin-bottom: 8px; }
  #input-codigo:focus { border-color: var(--azul); }
  #erro-codigo { font-size: 0.72rem; color: #c0392b; min-height: 18px; margin-bottom: 10px; }
  .modal-acoes { display: flex; gap: 8px; justify-content: flex-end; }
  .conflito-versao { border: 1px solid var(--linha-div); border-radius: 6px; padding: 10px 12px; margin-bottom: 10px; }
  .conflito-versao b { display: block; font-size: 0.68rem; color: var(--azul-escuro); text-transform: uppercase; letter-spacing: 0.05em; margin-bottom: 4px; }
  .conflito-versao span { font-size: 0.82rem; color: var(--azul-escuro); white-space: pre-wrap; }

  /* ===== RODAPÉ ===== */
  #rodape { position: fixed; bottom: 0; left: 0; right: 0; background: rgba(255,255,255,0.95); border-top: 1px solid var(--linha-div); padding: 5px 20px; font-size: 0.68rem; display: flex; justify-content: flex-end; backdrop-filter: blur(4px); }
  #texto-rodape.rodape-sincronizado { color: var(--cinza-linha); }
  #texto-rodape.rodape-salvando { color: var(--azul); }
  #texto-rodape.rodape-offline { color: var(--ambar); }

  /* ===== IMPRESSÃO ===== */
  @media print {
    @page { size: 1189mm 841mm landscape; margin: 12mm; }
    #header { position: static; box-shadow: none; }
    #barra-acoes, #rodape, #modal-login, #modal-conflito, #aviso-acesso, .btn-voltar, .btn-limpar-dia, #badge-modo { display: none !important; }
    #visao-geral { display: block !important; }
    #tela-semana, #tela-eleicao { display: none !important; }
    .cartao-semana, .cartao-eleicao { cursor: default; break-inside: avoid; }
    body { -webkit-print-color-adjust: exact; print-color-adjust: exact; }
    .grade-semanas { grid-template-columns: repeat(4, 1fr); gap: 10px; }
    #main { margin-top: 0; padding: 12px; }
  }
</style>
</head>
<body>

<!-- HEADER -->
<header id="header">
  <h1>Planejamento Eleitoral 2026</h1>
  <div id="header-right">
    <button id="badge-modo" class="visualizacao" onclick="clicarLogin()">Entrar para editar</button>
    <span class="pilula-candidata">Leatrice Bez 15104</span>
  </div>
</header>

<!-- AVISO DE ACESSO -->
<div id="aviso-acesso"></div>

<!-- MODAL LOGIN -->
<div id="modal-login">
  <div class="modal-box">
    <h3>Entrar para editar</h3>
    <p>Digite o seu <strong>código de edição</strong>. Ele é pessoal — não compartilhe em grupo.</p>
    <input type="password" id="input-codigo" placeholder="Seu código" autocomplete="off">
    <div id="erro-codigo"></div>
    <div class="modal-acoes">
      <button class="btn btn-outline" onclick="fecharModalLogin()">Cancelar</button>
      <button class="btn btn-azul" onclick="confirmarLogin()">Entrar</button>
    </div>
  </div>
</div>

<!-- MODAL CONFLITO -->
<div id="modal-conflito">
  <div class="modal-box">
    <h3>A outra pessoa alterou este campo</h3>
    <p>Escolha qual versão fica salva.</p>
    <div id="conflito-conteudo"></div>
    <div class="modal-acoes">
      <button class="btn btn-outline" onclick="resolverConflitoManter()">Manter o meu</button>
      <button class="btn btn-azul" onclick="resolverConflitoUsarRemoto()">Usar a de <span id="conflito-nome-remoto"></span></button>
    </div>
  </div>
</div>

<!-- MAIN -->
<div id="main">

  <!-- VISÃO GERAL -->
  <div id="visao-geral" class="ativo">
    <div id="barra-acoes">
      <button class="btn btn-azul" onclick="exportarBackup()">⬇ Exportar backup</button>
      <label class="btn btn-outline" id="label-importar" style="cursor:pointer">
        ⬆ Importar backup
        <input type="file" accept=".json" style="display:none" onchange="importarBackup(event)">
      </label>
      <button class="btn btn-laranja" onclick="imprimirPlanner()">🖨 Imprimir</button>
    </div>
    <div class="grade-semanas" id="grade-semanas"></div>
  </div>

  <!-- TELA SEMANA (página 2: lista de dias) -->
  <div id="tela-semana">
    <div style="margin-bottom:14px">
      <button class="btn-voltar" onclick="voltarVisaoGeral()">← Voltar para a visão geral</button>
    </div>
    <div class="semana-nav">
      <button class="btn btn-outline" id="btn-sem-ant" onclick="navegarSemana(-1)">‹ Anterior</button>
      <h2 id="titulo-semana">Semana <span id="periodo-semana"></span></h2>
      <button class="btn btn-outline" id="btn-prox-sem" onclick="navegarSemana(1)">Próxima ›</button>
    </div>
    <div id="cards-dias"></div>
  </div>

  <!-- TELA DIA (página 3: horários do dia) -->
  <div id="tela-dia">
    <div style="margin-bottom:14px">
      <button class="btn-voltar" id="btn-voltar-semana" onclick="voltarTelaSemana()">← Voltar para a semana</button>
    </div>
    <div id="conteudo-dia"></div>
  </div>

  <!-- TELA ELEIÇÃO -->
  <div id="tela-eleicao">
    <div style="margin-bottom:14px">
      <button class="btn-voltar" onclick="voltarVisaoGeral()">← Voltar para a visão geral</button>
    </div>
    <div class="bloco-eleicao">
      <div class="bloco-eleicao-header">
        <span>🗳 Dia da Eleição — 4 de outubro de 2026 (domingo)</span>
        <span class="autoria" id="autoria-eleicao" style="margin-top:0"></span>
      </div>
      <div class="bloco-eleicao-campos" id="campos-eleicao"></div>
    </div>
  </div>

</div>

<!-- RODAPÉ -->
<div id="rodape">
  <span id="texto-rodape" class="rodape-sincronizado">Conectando…</span>
</div>

<script>
// ===================================================
// CONFIG
// ===================================================
const API_URL = "https://script.google.com/macros/s/AKfycbwIThxietEnC8XdRrKRFvmFsdCvkpKZOzDDOk0bZdPPPPobSmXSmNHo8revL4gOBAws_Q/exec";
const CHAVE_LS     = 'planner_leatrice_2026_registro';
const CHAVE_FILA   = 'planner_leatrice_2026_fila';
const CHAVE_CODIGO = 'planner_leatrice_2026_codigo';

// ===================================================
// DADOS DAS SEMANAS
// ===================================================
const SEMANAS = [
  { num: 1, periodo: '16 a 22 de agosto de 2026',            inicio: '2026-08-16' },
  { num: 2, periodo: '23 a 29 de agosto de 2026',             inicio: '2026-08-23' },
  { num: 3, periodo: '30 de agosto a 5 de setembro de 2026',  inicio: '2026-08-30' },
  { num: 4, periodo: '6 a 12 de setembro de 2026',            inicio: '2026-09-06' },
  { num: 5, periodo: '13 a 19 de setembro de 2026',           inicio: '2026-09-13' },
  { num: 6, periodo: '20 a 26 de setembro de 2026',           inicio: '2026-09-20' },
  { num: 7, periodo: '27 de setembro a 3 de outubro de 2026', inicio: '2026-09-27' },
];
const ABREVS       = ['DOM','SEG','TER','QUA','QUI','SEX','SÁB'];
const DIAS_SEMANA  = ['Domingo','Segunda-feira','Terça-feira','Quarta-feira','Quinta-feira','Sexta-feira','Sábado'];
const MESES_EXT    = ['janeiro','fevereiro','março','abril','maio','junho','julho','agosto','setembro','outubro','novembro','dezembro'];
const MESES        = ['jan','fev','mar','abr','mai','jun','jul','ago','set','out','nov','dez'];
const HORAS = [];
for (let h = 6; h <= 24; h++) {
  HORAS.push(String(h).padStart(2,'0') + ':00');
  if (h < 24) HORAS.push(String(h).padStart(2,'0') + ':30');
}

const CAMPOS_ELEICAO = [
  { key: 'cidadeBase',          label: 'Cidade base' },
  { key: 'coordenador',         label: 'Coordenador responsável' },
  { key: 'equipe',              label: 'Equipe / Apoio' },
  { key: 'horarioDeslocamento', label: 'Horário de deslocamento' },
  { key: 'observacoes',         label: 'Observações' },
];

function datasDaSemana(iso) {
  const dias = [];
  const base = new Date(iso + 'T12:00:00Z');
  for (let i = 0; i < 7; i++) {
    const d = new Date(base);
    d.setUTCDate(d.getUTCDate() + i);
    dias.push(d.toISOString().slice(0, 10));
  }
  return dias;
}

// ===================================================
// CHAVES (formato data|campo, ou eleicao|campo)
// ===================================================
function chaveHora(dataIso, hora) { return dataIso + '|h' + hora.replace(':', ''); }
function chavesDoDia(dataIso) {
  return [dataIso + '|cidade', dataIso + '|coordenador'].concat(HORAS.map(h => chaveHora(dataIso, h)));
}
function chavesDaSemana(sem) {
  return datasDaSemana(sem.inicio).reduce((acc, d) => acc.concat(chavesDoDia(d)), []);
}
function chaveEleicao(campo) { return 'eleicao|' + campo; }
function chavesEleicao() { return CAMPOS_ELEICAO.map(c => chaveEleicao(c.key)); }

// ===================================================
// ESTADO
// ===================================================
let registro = {};       // chave -> { valor, em, por }
let filaPendente = {};   // chave -> valor, aguardando envio ao servidor
let conflitos = {};      // chave -> { valor, em, por } vindo do servidor, aguardando decisão
let chaveConflitoAberta = null;
let chaveFocada = null;

let modoEditor = false;
let codigoAtual = null;
let nomeAtual = null;

let saveTimer = null;
let enviando = false;
let ultimoSync = new Date(0).toISOString();
let syncInterval = null;
let avisoTimer = null;

let semanaAtual = 0;
let telaAtiva = 'visao-geral';
let diaAtual = null;

// ===================================================
// PERSISTÊNCIA LOCAL
// ===================================================
function carregarLocal() {
  try { registro = JSON.parse(localStorage.getItem(CHAVE_LS)) || {}; } catch(e) { registro = {}; }
  try { filaPendente = JSON.parse(localStorage.getItem(CHAVE_FILA)) || {}; } catch(e) { filaPendente = {}; }
}

function persistirLocal() {
  try {
    localStorage.setItem(CHAVE_LS, JSON.stringify(registro));
    localStorage.setItem(CHAVE_FILA, JSON.stringify(filaPendente));
  } catch(e) {}
}

function restaurarSessaoLocal() {
  const salvo = localStorage.getItem(CHAVE_CODIGO);
  if (!salvo) return;
  try {
    const s = JSON.parse(salvo);
    codigoAtual = s.codigo;
    nomeAtual = s.nome;
    modoEditor = true;
  } catch(e) {}
}

async function revalidarSessaoEmSegundoPlano() {
  if (!codigoAtual) return;
  try {
    const resp = await getAPI({ acao: 'validar', codigo: codigoAtual });
    if (!resp.ok) {
      sairModoEditor(null); // acesso já não existia; sem alarde, é checagem silenciosa
    } else {
      nomeAtual = resp.nome;
      localStorage.setItem(CHAVE_CODIGO, JSON.stringify({ codigo: codigoAtual, nome: nomeAtual }));
      atualizarBadgeLogin();
      reRenderTela();
    }
  } catch(e) {
    // offline: mantém a sessão local, tenta de novo no próximo sync
  }
}

// ===================================================
// API
// ===================================================
async function getAPI(params) {
  const qs = new URLSearchParams(params).toString();
  const r = await fetch(API_URL + '?' + qs);
  if (!r.ok) throw new Error('HTTP ' + r.status);
  return r.json();
}

async function postAPI(corpo) {
  const r = await fetch(API_URL, {
    method: 'POST',
    headers: { 'Content-Type': 'text/plain;charset=utf-8' },
    body: JSON.stringify(corpo),
  });
  if (!r.ok) throw new Error('HTTP ' + r.status);
  return r.json();
}

// ===================================================
// SINCRONIZAÇÃO (LEITURA)
// ===================================================
async function sincronizar() {
  try {
    const resp = await getAPI({ acao: 'ler', desde: ultimoSync });
    if (!resp.ok) return;
    aplicarAtualizacoesRemotas(resp.dados || {});
    ultimoSync = resp.servidorEm || ultimoSync;
    if (Object.keys(filaPendente).length === 0) atualizarStatusConexao('sincronizado');
  } catch(e) {
    atualizarStatusConexao('offline');
  }
}

function aplicarAtualizacoesRemotas(dados) {
  let mudou = false;
  Object.keys(dados).forEach(chave => {
    const novo = dados[chave];
    if (modoEditor && chave === chaveFocada) {
      const localValor = registro[chave] ? registro[chave].valor : '';
      if (novo.valor !== localValor) {
        conflitos[chave] = novo;
        mudou = true;
      }
      return;
    }
    if (filaPendente.hasOwnProperty(chave)) return; // ainda não confirmamos nossa própria escrita
    registro[chave] = novo;
    mudou = true;
  });
  persistirLocal();
  if (mudou) reRenderTela();
}

// ===================================================
// LOGIN / MODO EDITOR
// ===================================================
function clicarLogin() {
  if (modoEditor) logout();
  else abrirModalLogin();
}

function abrirModalLogin() {
  document.getElementById('erro-codigo').textContent = '';
  document.getElementById('input-codigo').value = '';
  document.getElementById('modal-login').classList.add('visivel');
  setTimeout(() => document.getElementById('input-codigo').focus(), 50);
}

function fecharModalLogin() {
  document.getElementById('modal-login').classList.remove('visivel');
}

async function confirmarLogin() {
  const codigo = document.getElementById('input-codigo').value.trim();
  const erro = document.getElementById('erro-codigo');
  if (!codigo) { erro.textContent = 'Digite seu código.'; return; }
  erro.textContent = 'Verificando…';
  try {
    const resp = await getAPI({ acao: 'validar', codigo });
    if (resp.ok) {
      codigoAtual = codigo;
      nomeAtual = resp.nome;
      modoEditor = true;
      localStorage.setItem(CHAVE_CODIGO, JSON.stringify({ codigo, nome: resp.nome }));
      fecharModalLogin();
      atualizarBadgeLogin();
      atualizarVisibilidadeAcoes();
      reRenderTela();
    } else {
      erro.textContent = 'Código não reconhecido.';
    }
  } catch(e) {
    erro.textContent = 'Sem conexão. Tente novamente em instantes.';
  }
}

async function logout() {
  await tentarEnviar(); // não perde nada pendente antes de sair
  sairModoEditor(null);
}

function sairModoEditor(mensagem) {
  modoEditor = false;
  codigoAtual = null;
  nomeAtual = null;
  localStorage.removeItem(CHAVE_CODIGO);
  atualizarBadgeLogin();
  atualizarVisibilidadeAcoes();
  if (mensagem) mostrarAvisoAcesso(mensagem);
  reRenderTela();
}

function atualizarBadgeLogin() {
  const b = document.getElementById('badge-modo');
  if (modoEditor) {
    b.className = 'editor';
    b.textContent = 'Editando como ' + nomeAtual + ' · Sair';
  } else {
    b.className = 'visualizacao';
    b.textContent = 'Entrar para editar';
  }
}

function atualizarVisibilidadeAcoes() {
  document.getElementById('label-importar').style.display = modoEditor ? '' : 'none';
}

function mostrarAvisoAcesso(msg) {
  const el = document.getElementById('aviso-acesso');
  el.textContent = msg;
  el.classList.add('visivel');
  clearTimeout(avisoTimer);
  avisoTimer = setTimeout(() => el.classList.remove('visivel'), 7000);
}

document.getElementById('input-codigo')?.addEventListener?.('keydown', () => {});
document.addEventListener('keydown', e => {
  if (e.target && e.target.id === 'input-codigo' && e.key === 'Enter') confirmarLogin();
});

// ===================================================
// GRAVAÇÃO
// ===================================================
function definirCampo(chave, valor) {
  const anterior = registro[chave];
  if (anterior && anterior.valor === valor) return;
  registro[chave] = { valor: valor, em: new Date().toISOString(), por: nomeAtual || (anterior ? anterior.por : '') };
  filaPendente[chave] = valor;
  persistirLocal();
  agendarSalvamento();
}

function agendarSalvamento() {
  clearTimeout(saveTimer);
  saveTimer = setTimeout(tentarEnviar, 400);
}

async function tentarEnviar() {
  if (enviando) return;
  const chaves = Object.keys(filaPendente);
  if (chaves.length === 0) return;
  if (!modoEditor || !codigoAtual) return;

  enviando = true;
  atualizarStatusConexao('salvando');
  const itens = chaves.map(ch => ({ chave: ch, valor: filaPendente[ch] }));
  try {
    const resp = await postAPI({ codigo: codigoAtual, acao: 'gravar', itens: itens });
    if (resp.ok) {
      chaves.forEach(ch => delete filaPendente[ch]);
      ultimoSync = resp.servidorEm || ultimoSync;
      persistirLocal();
      atualizarStatusConexao('sincronizado');
    } else {
      enviando = false;
      sairModoEditor('Seu acesso de edição foi encerrado.');
      return;
    }
  } catch(e) {
    atualizarStatusConexao('offline');
  } finally {
    enviando = false;
    if (Object.keys(filaPendente).length > 0) agendarSalvamento();
  }
}

function atualizarStatusConexao(estadoConexao) {
  const el = document.getElementById('texto-rodape');
  el.classList.remove('rodape-sincronizado', 'rodape-salvando', 'rodape-offline');
  if (estadoConexao === 'salvando') {
    el.textContent = 'Salvando...';
    el.classList.add('rodape-salvando');
  } else if (estadoConexao === 'offline') {
    el.textContent = 'Sem conexão · alterações guardadas neste computador';
    el.classList.add('rodape-offline');
  } else {
    const agora = new Date();
    const hh = String(agora.getHours()).padStart(2,'0');
    const mm = String(agora.getMinutes()).padStart(2,'0');
    el.textContent = 'Sincronizado · ' + hh + ':' + mm;
    el.classList.add('rodape-sincronizado');
  }
}

// ===================================================
// CONFLITOS
// ===================================================
function marcarChaveEmConflito(chave) {
  return !!conflitos[chave];
}

function abrirConflito(chave) {
  chaveConflitoAberta = chave;
  const remoto = conflitos[chave];
  const local = registro[chave];
  const conteudo = document.getElementById('conflito-conteudo');
  conteudo.innerHTML =
    '<div class="conflito-versao"><b>Sua versão</b><span>' + esc(local ? local.valor : '') + '</span></div>' +
    '<div class="conflito-versao"><b>Versão de ' + esc(remoto.por || 'outra pessoa') + '</b><span>' + esc(remoto.valor) + '</span></div>';
  document.getElementById('conflito-nome-remoto').textContent = remoto.por || 'outra pessoa';
  document.getElementById('modal-conflito').classList.add('visivel');
}

function resolverConflitoManter() {
  if (!chaveConflitoAberta) return;
  const chave = chaveConflitoAberta;
  filaPendente[chave] = registro[chave] ? registro[chave].valor : '';
  delete conflitos[chave];
  persistirLocal();
  fecharModalConflito();
  agendarSalvamento();
  reRenderTela();
}

function resolverConflitoUsarRemoto() {
  if (!chaveConflitoAberta) return;
  const chave = chaveConflitoAberta;
  registro[chave] = conflitos[chave];
  delete filaPendente[chave];
  delete conflitos[chave];
  persistirLocal();
  fecharModalConflito();
  reRenderTela();
}

function fecharModalConflito() {
  document.getElementById('modal-conflito').classList.remove('visivel');
  chaveConflitoAberta = null;
}

// ===================================================
// FOCO (para não sobrescrever campo em edição)
// ===================================================
document.addEventListener('focusin', e => {
  if (modoEditor && e.target && e.target.dataset && e.target.dataset.chave) chaveFocada = e.target.dataset.chave;
});
document.addEventListener('focusout', e => {
  if (e.target && e.target.dataset && e.target.dataset.chave === chaveFocada) chaveFocada = null;
});

// ===================================================
// AUTORIA (agregada)
// ===================================================
function metaAgregada(chaves) {
  let melhor = null;
  chaves.forEach(ch => {
    const m = registro[ch];
    if (m && m.em && (!melhor || m.em > melhor.em)) melhor = m;
  });
  return melhor;
}

function formatarHora(iso) {
  try {
    const d = new Date(iso);
    return String(d.getHours()).padStart(2,'0') + ':' + String(d.getMinutes()).padStart(2,'0');
  } catch(e) { return ''; }
}

function linhaAutoria(meta, classeExtra) {
  if (!meta || !meta.em || !meta.por) return '';
  return '<div class="autoria' + (classeExtra ? ' ' + classeExtra : '') + '">alterado por ' + esc(meta.por) + ' · ' + formatarHora(meta.em) + '</div>';
}

// ===================================================
// NAVEGAÇÃO
// ===================================================
function mostrarTela(tela) {
  ['visao-geral','tela-semana','tela-dia','tela-eleicao'].forEach(id =>
    document.getElementById(id).classList.remove('ativo'));
  document.getElementById(tela).classList.add('ativo');
  telaAtiva = tela;
}

function reRenderTela() {
  if (telaAtiva === 'visao-geral') renderizarVisaoGeral();
  else if (telaAtiva === 'tela-semana') renderizarTelaSemana();
  else if (telaAtiva === 'tela-dia') renderizarTelaDia();
  else if (telaAtiva === 'tela-eleicao') renderizarTelaEleicao();
}

function abrirSemana(idx) {
  semanaAtual = idx;
  renderizarTelaSemana();
  mostrarTela('tela-semana');
  window.scrollTo(0, 0);
}

function abrirDia(dataIso) {
  diaAtual = dataIso;
  renderizarTelaDia();
  mostrarTela('tela-dia');
  window.scrollTo(0, 0);
}

function abrirEleicao() {
  renderizarTelaEleicao();
  mostrarTela('tela-eleicao');
  window.scrollTo(0, 0);
}

function voltarVisaoGeral() {
  renderizarVisaoGeral();
  mostrarTela('visao-geral');
  window.scrollTo(0, 0);
}

function voltarTelaSemana() {
  renderizarTelaSemana();
  mostrarTela('tela-semana');
  window.scrollTo(0, 0);
}

function navegarSemana(delta) {
  const novo = semanaAtual + delta;
  if (novo < 0 || novo >= SEMANAS.length) return;
  semanaAtual = novo;
  renderizarTelaSemana();
  window.scrollTo(0, 0);
}

document.addEventListener('keydown', e => {
  if (e.key === 'Escape') {
    if (document.getElementById('modal-login').classList.contains('visivel')) fecharModalLogin();
    else if (document.getElementById('modal-conflito').classList.contains('visivel')) fecharModalConflito();
    else if (telaAtiva === 'tela-dia') voltarTelaSemana();
    else if (telaAtiva !== 'visao-geral') voltarVisaoGeral();
  }
});

// ===================================================
// VISÃO GERAL
// ===================================================
function renderizarVisaoGeral() {
  const grade = document.getElementById('grade-semanas');
  grade.innerHTML = '';

  SEMANAS.forEach((sem, idx) => {
    const datas = datasDaSemana(sem.inicio);
    const preenchidos = datas.filter(d => {
      const cidade = getValor(d + '|cidade');
      const coord  = getValor(d + '|coordenador');
      const temHora = HORAS.some(h => getValor(chaveHora(d, h)));
      return cidade || coord || temHora;
    }).length;

    const metaSemana = metaAgregada(chavesDaSemana(sem));

    const cartao = document.createElement('div');
    cartao.className = 'cartao-semana';
    cartao.onclick = () => abrirSemana(idx);

    cartao.innerHTML =
      '<div class="cartao-header">' +
        '<div class="circulo-sem"><span class="label-sem">SEM</span><span class="num-sem">' + sem.num + '</span></div>' +
        '<div class="cartao-header-info">' +
          '<div class="cartao-header-titulo">Roteiro Semanal</div>' +
          '<div class="cartao-header-periodo">' + sem.periodo + '</div>' +
          linhaAutoria(metaSemana) +
        '</div>' +
        '<div class="pilula-contador">' + preenchidos + '/7 dias</div>' +
      '</div>';

    const lista = document.createElement('div');
    lista.className = 'lista-dias';
    datas.forEach(dataIso => {
      const d = new Date(dataIso + 'T12:00:00Z');
      const abrev = ABREVS[d.getUTCDay()];
      const numDia = d.getUTCDate();
      const cidade = getValor(dataIso + '|cidade');
      const coord  = getValor(dataIso + '|coordenador');
      const horasPreenchidas = HORAS.filter(h => getValor(chaveHora(dataIso, h)));
      const tem = cidade || coord || horasPreenchidas.length > 0;

      const linha = document.createElement('div');
      linha.className = 'linha-dia';
      linha.innerHTML =
        '<div class="badge-dia"><div class="abrev">' + abrev + '</div><div class="num-dia">' + numDia + '</div></div>' +
        '<div class="resumo-dia">' +
          (tem ? (
            (cidade ? '<div class="resumo-cidade">' + esc(cidade) + '</div>' : '') +
            (coord ? '<div class="resumo-coord">' + esc(coord) + '</div>' : '') +
            (horasPreenchidas.length > 0 ? '<div class="resumo-ativ">' + horasPreenchidas.map(h => {
              const v = getValor(chaveHora(dataIso, h));
              return '<span style="margin-right:8px"><b>' + h + '</b> ' + esc(v) + '</span>';
            }).join('') + '</div>' : '')
          ) : '<div class="resumo-vazio">— sem definição —</div>') +
        '</div>';
      lista.appendChild(linha);
    });
    cartao.appendChild(lista);
    grade.appendChild(cartao);
  });

  // Cartão eleição
  const temEl = CAMPOS_ELEICAO.some(c => getValor(chaveEleicao(c.key)));
  const metaEl = metaAgregada(chavesEleicao());
  const cartaoEl = document.createElement('div');
  cartaoEl.className = 'cartao-eleicao';
  cartaoEl.onclick = abrirEleicao;
  cartaoEl.innerHTML =
    '<div class="cartao-eleicao-header">' +
      '<div class="circulo-el"><span class="label-el">4/OUT</span><span class="num-el">🗳</span></div>' +
      '<div class="cartao-header-info" style="color:#fff">' +
        '<div class="cartao-header-titulo">Dia da Eleição</div>' +
        '<div class="cartao-header-periodo">4 de outubro de 2026 • Domingo</div>' +
        linhaAutoria(metaEl) +
      '</div>' +
    '</div>' +
    '<div class="cartao-eleicao-body" id="resumo-eleicao"></div>';
  grade.appendChild(cartaoEl);

  const resumoEl = document.getElementById('resumo-eleicao');
  if (temEl) {
    resumoEl.innerHTML = '';
    CAMPOS_ELEICAO.forEach(c => {
      const v = getValor(chaveEleicao(c.key));
      if (!v) return;
      resumoEl.innerHTML += '<div class="campo-el-resumo"><div class="campo-el-label">' + esc(c.label) + '</div><div class="campo-el-valor">' + esc(v) + '</div></div>';
    });
  } else {
    resumoEl.innerHTML = '<div class="campo-el-vazio">— clique para preencher —</div>';
  }
}

function getValor(chave) {
  return (registro[chave] && registro[chave].valor) || '';
}

// ===================================================
// PÁGINA 2 — LISTA DE DIAS DA SEMANA
// ===================================================
function renderizarTelaSemana() {
  const sem = SEMANAS[semanaAtual];
  const datas = datasDaSemana(sem.inicio);
  document.getElementById('titulo-semana').childNodes[0].textContent = 'Semana ' + sem.num + ' — ';
  document.getElementById('periodo-semana').textContent = sem.periodo;
  document.getElementById('btn-sem-ant').disabled = semanaAtual === 0;
  document.getElementById('btn-prox-sem').disabled = semanaAtual === SEMANAS.length - 1;

  const container = document.getElementById('cards-dias');
  container.innerHTML = '';

  datas.forEach(dataIso => {
    const d = new Date(dataIso + 'T12:00:00Z');
    const chCidade = dataIso + '|cidade';
    const chCoord  = dataIso + '|coordenador';
    const horasPreenchidas = HORAS.filter(h => getValor(chaveHora(dataIso, h)));
    const ro = modoEditor ? '' : 'readonly';
    const metaDia = metaAgregada(chavesDoDia(dataIso));

    const card = document.createElement('div');
    card.className = 'card-dia';

    const faixa = document.createElement('div');
    faixa.className = 'card-dia-faixa';
    faixa.style.cursor = 'pointer';
    faixa.innerHTML = '<div class="ds">' + ABREVS[d.getUTCDay()] + '</div><div class="dd">' + d.getUTCDate() + '</div><div class="dm">' + MESES[d.getUTCMonth()] + '</div>';
    faixa.onclick = () => abrirDia(dataIso);

    const corpo = document.createElement('div');
    corpo.className = 'card-dia-corpo';
    corpo.style.gap = '8px';
    corpo.innerHTML =
      '<div style="display:flex;gap:16px;align-items:flex-end;">' +
        '<div style="flex:1">' +
          '<label class="campo-label" style="font-size:0.58rem">Cidade</label>' +
          '<input class="campo-input' + (marcarChaveEmConflito(chCidade) ? ' campo-conflito' : '') + '" type="text" data-chave="' + chCidade + '" value="' + esc(getValor(chCidade)) + '" placeholder="' + (modoEditor ? 'Informe a cidade…' : '—') + '" ' + ro + ' style="font-size:0.84rem">' +
          (marcarChaveEmConflito(chCidade) ? '<div class="aviso-conflito" onclick="abrirConflito(\'' + chCidade + '\')">A outra pessoa alterou este campo. Clique para ver.</div>' : '') +
        '</div>' +
        '<div style="flex:1">' +
          '<label class="campo-label" style="font-size:0.58rem">Coordenador</label>' +
          '<input class="campo-input' + (marcarChaveEmConflito(chCoord) ? ' campo-conflito' : '') + '" type="text" data-chave="' + chCoord + '" value="' + esc(getValor(chCoord)) + '" placeholder="' + (modoEditor ? 'Nome do coordenador…' : '—') + '" ' + ro + ' style="font-size:0.84rem">' +
          (marcarChaveEmConflito(chCoord) ? '<div class="aviso-conflito" onclick="abrirConflito(\'' + chCoord + '\')">A outra pessoa alterou este campo. Clique para ver.</div>' : '') +
        '</div>' +
      '</div>' +
      (horasPreenchidas.length > 0
        ? '<div class="card-dia-horas">' + horasPreenchidas.map(h => esc(h)).join(' · ') + '</div>'
        : '') +
      linhaAutoria(metaDia, 'autoria-clara');

    const seta = document.createElement('div');
    seta.className = 'card-dia-seta';
    seta.style.cursor = 'pointer';
    seta.innerHTML = '›';
    seta.title = 'Abrir horários';
    seta.onclick = () => abrirDia(dataIso);

    if (modoEditor) {
      corpo.querySelectorAll('[data-chave]').forEach(inp => {
        inp.addEventListener('input', e => definirCampo(e.target.dataset.chave, e.target.value));
        inp.addEventListener('click', e => e.stopPropagation());
      });
    }

    card.appendChild(faixa);
    card.appendChild(corpo);
    card.appendChild(seta);
    container.appendChild(card);
  });
}

// ===================================================
// PÁGINA 3 — HORÁRIOS DE UM DIA
// ===================================================
function renderizarTelaDia() {
  const dataIso = diaAtual;
  const d = new Date(dataIso + 'T12:00:00Z');
  const sem = SEMANAS[semanaAtual];
  const ro = modoEditor ? '' : 'readonly';
  const chCidade = dataIso + '|cidade';
  const chCoord  = dataIso + '|coordenador';
  const metaDia = metaAgregada(chavesDoDia(dataIso));

  document.getElementById('btn-voltar-semana').textContent = '← Semana ' + sem.num + ' — ' + sem.periodo;

  const container = document.getElementById('conteudo-dia');
  container.innerHTML = '';

  // Título do dia
  const titulo = document.createElement('div');
  titulo.style.cssText = 'display:flex;align-items:center;justify-content:space-between;margin-bottom:6px;';
  titulo.innerHTML =
    '<h2 style="font-size:1rem;color:var(--azul-escuro);">' +
      DIAS_SEMANA[d.getUTCDay()] + ', ' + d.getUTCDate() + ' de ' + MESES_EXT[d.getUTCMonth()] +
    '</h2>' +
    '<button class="btn-limpar-dia" onclick="limparDia(\'' + dataIso + '\')" ' + (modoEditor ? '' : 'disabled') + '>Limpar dia</button>';
  container.appendChild(titulo);

  const linhaMeta = document.createElement('div');
  linhaMeta.style.marginBottom = '10px';
  linhaMeta.innerHTML = linhaAutoria(metaDia, 'autoria-clara');
  container.appendChild(linhaMeta);

  // Bloco cidade + coordenador
  const cab = document.createElement('div');
  cab.style.cssText = 'display:flex;gap:20px;margin-bottom:16px;padding:14px 16px;border:1px solid var(--linha-div);border-radius:8px;background:#fff;';
  cab.innerHTML =
    '<div style="flex:1">' +
      '<label class="campo-label">Cidade</label>' +
      '<input class="campo-input' + (marcarChaveEmConflito(chCidade) ? ' campo-conflito' : '') + '" type="text" data-chave="' + chCidade + '" value="' + esc(getValor(chCidade)) + '" placeholder="' + (modoEditor ? 'Informe a cidade…' : '') + '" ' + ro + '>' +
      (marcarChaveEmConflito(chCidade) ? '<div class="aviso-conflito" onclick="abrirConflito(\'' + chCidade + '\')">A outra pessoa alterou este campo. Clique para ver.</div>' : '') +
    '</div>' +
    '<div style="flex:1">' +
      '<label class="campo-label">Coordenador responsável</label>' +
      '<input class="campo-input' + (marcarChaveEmConflito(chCoord) ? ' campo-conflito' : '') + '" type="text" data-chave="' + chCoord + '" value="' + esc(getValor(chCoord)) + '" placeholder="' + (modoEditor ? 'Nome do coordenador…' : '') + '" ' + ro + '>' +
      (marcarChaveEmConflito(chCoord) ? '<div class="aviso-conflito" onclick="abrirConflito(\'' + chCoord + '\')">A outra pessoa alterou este campo. Clique para ver.</div>' : '') +
    '</div>';
  container.appendChild(cab);

  // Grade de horários
  const gradeWrap = document.createElement('div');
  gradeWrap.style.cssText = 'border:1px solid var(--linha-div);border-radius:8px;overflow:hidden;';
  const grade = document.createElement('div');
  grade.className = 'grade-horas';
  HORAS.forEach(hora => {
    const chave = chaveHora(dataIso, hora);
    const isMeia = hora.endsWith(':30');
    const linha = document.createElement('div');
    linha.className = 'linha-hora' + (isMeia ? ' meia' : '');
    linha.innerHTML =
      '<div class="celula-hora' + (isMeia ? ' meia' : '') + '">' + hora + '</div>' +
      '<div class="celula-atividade">' +
        '<input type="text" class="' + (marcarChaveEmConflito(chave) ? 'campo-conflito' : '') + '" data-chave="' + chave + '" value="' + esc(getValor(chave)) + '" placeholder="' + (modoEditor ? '…' : '') + '" ' + ro + '>' +
        (marcarChaveEmConflito(chave) ? '<div class="aviso-conflito" onclick="abrirConflito(\'' + chave + '\')">A outra pessoa alterou este campo. Clique para ver.</div>' : '') +
      '</div>';
    grade.appendChild(linha);
  });
  gradeWrap.appendChild(grade);
  container.appendChild(gradeWrap);

  // Eventos de edição
  if (modoEditor) {
    container.querySelectorAll('[data-chave]').forEach(inp => {
      inp.addEventListener('input', e => definirCampo(e.target.dataset.chave, e.target.value));
    });
  }
}

function limparDiaSeVazio() { /* mantido: não há mais objeto por dia a limpar, cada campo é isolado */ }

function limparDia(dataIso) {
  if (!modoEditor) return;
  if (!confirm('Apagar todos os dados deste dia?')) return;
  chavesDoDia(dataIso).forEach(ch => definirCampo(ch, ''));
  reRenderTela();
}

// ===================================================
// TELA ELEIÇÃO
// ===================================================
function renderizarTelaEleicao() {
  const container = document.getElementById('campos-eleicao');
  container.innerHTML = '';
  const ro = modoEditor ? '' : 'readonly';
  const metaEl = metaAgregada(chavesEleicao());
  document.getElementById('autoria-eleicao').innerHTML = linhaAutoria(metaEl).replace('<div class="autoria">', '<span>').replace('</div>', '</span>');

  CAMPOS_ELEICAO.forEach(c => {
    const chave = chaveEleicao(c.key);
    const isLonga = c.key === 'observacoes' || c.key === 'equipe';
    const grupo = document.createElement('div');
    grupo.className = 'campo-grupo';
    grupo.innerHTML =
      '<label class="campo-label">' + esc(c.label) + '</label>' +
      (isLonga
        ? '<textarea class="campo-textarea' + (marcarChaveEmConflito(chave) ? ' campo-conflito' : '') + '" data-chave="' + chave + '" ' + ro + ' placeholder="' + (modoEditor ? '…' : '') + '" rows="2">' + esc(getValor(chave)) + '</textarea>'
        : '<input class="campo-input' + (marcarChaveEmConflito(chave) ? ' campo-conflito' : '') + '" type="text" data-chave="' + chave + '" value="' + esc(getValor(chave)) + '" placeholder="' + (modoEditor ? '…' : '') + '" ' + ro + '>'
      ) +
      (marcarChaveEmConflito(chave) ? '<div class="aviso-conflito" onclick="abrirConflito(\'' + chave + '\')">A outra pessoa alterou este campo. Clique para ver.</div>' : '');
    container.appendChild(grupo);
  });

  if (modoEditor) {
    container.querySelectorAll('[data-chave]').forEach(inp => {
      inp.addEventListener('input', e => {
        definirCampo(e.target.dataset.chave, e.target.value);
        if (inp.tagName === 'TEXTAREA') autoResize(inp);
      });
      if (inp.tagName === 'TEXTAREA') autoResize(inp);
    });
  } else {
    container.querySelectorAll('textarea').forEach(autoResize);
  }
}

function autoResize(ta) { ta.style.height = 'auto'; ta.style.height = ta.scrollHeight + 'px'; }

// ===================================================
// EXPORTAR / IMPORTAR
// ===================================================
function exportarBackup() {
  const hoje = new Date().toISOString().slice(0, 10);
  const blob = new Blob([JSON.stringify({ registro: registro, exportadoEm: new Date().toISOString() }, null, 2)], { type: 'application/json' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = 'planner_leatrice_' + hoje + '.json';
  a.click();
}

function importarBackup(event) {
  if (!modoEditor) { alert('Ative o modo editor para importar.'); event.target.value = ''; return; }
  const file = event.target.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = e => {
    try {
      const dados = JSON.parse(e.target.result);
      if (!dados.registro) throw new Error();
      if (!confirm('Substituir todos os dados pelo backup selecionado? As alterações também serão enviadas ao servidor.')) return;
      Object.keys(dados.registro).forEach(ch => definirCampo(ch, dados.registro[ch].valor || ''));
      renderizarVisaoGeral();
      mostrarTela('visao-geral');
      alert('Backup importado. Enviando ao servidor…');
    } catch(err) { alert('Arquivo inválido ou corrompido.'); }
  };
  reader.readAsText(file);
  event.target.value = '';
}

function imprimirPlanner() {
  if (telaAtiva !== 'visao-geral') voltarVisaoGeral();
  setTimeout(() => window.print(), 100);
}

// ===================================================
// UTILITÁRIOS
// ===================================================
function esc(str) {
  return String(str || '')
    .replace(/&/g, '&amp;').replace(/</g, '&lt;')
    .replace(/>/g, '&gt;').replace(/"/g, '&quot;');
}

restaurarSessaoLocal();
atualizarBadgeLogin();
atualizarVisibilidadeAcoes();

syncInterval = setInterval(sincronizar, 10000);
if (Object.keys(filaPendente).length > 0) agendarSalvamento();

window.addEventListener('online', () => { sincronizar(); if (Object.keys(filaPendente).length > 0) agendarSalvamento(); });
window.addEventListener('offline', () => atualizarStatusConexao('offline'));
document.addEventListener('visibilitychange', () => { if (!document.hidden) sincronizar(); });
